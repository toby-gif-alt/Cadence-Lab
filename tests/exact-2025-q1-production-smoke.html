<!doctype html>
<html lang="en-NZ">
<head><meta charset="utf-8"><title>2025 Q1 production-loading smoke test</title></head>
<body data-status="running">
<iframe id="app" title="Cadence Lab production frame" src="../index.html?question=nzqa-2025-bach-analysis" style="width:1100px;height:950px"></iframe>
<pre id="results">Running…</pre>
<script>
  const frame = document.querySelector('#app');
  const results = document.querySelector('#results');
  const assertions = {};
  const details = {};
  const assert = (name, condition, detail = null) => {
    assertions[name] = Boolean(condition);
    if (!condition && detail != null) details[name] = detail;
  };
  function finish(error = null) {
    if (error) details.error = error.stack || String(error);
    const passed = !error && Object.values(assertions).every(Boolean);
    document.body.dataset.status = passed ? 'pass' : 'fail';
    results.textContent = JSON.stringify({passed, assertions, details}, null, 2);
  }
  window.addEventListener('error', event => finish(event.error || event.message));
  window.addEventListener('unhandledrejection', event => finish(event.reason));
  frame.addEventListener('load', () => {
    try {
      const w = frame.contentWindow;
      const d = frame.contentDocument;
      const lab = w.CadenceLab;
      const validator = w.CadenceQuestionValidator?.report;
      assert('production-app-loaded', Boolean(lab));
      assert('production-validator-valid', validator?.valid === true, validator?.errors);
      assert('production-has-eight-exact-nzqa-references', validator?.referenceCount === 8, validator?.referenceCount);
      const yearState = lab.referenceYearState('nzqa-reference');
      assert('production-has-three-2025-references', yearState.counts?.[2025] === 3, yearState);
      assert('production-year-option-shows-2025-count', [...d.querySelector('#source-year').options].some(option => option.value === '2025' && option.textContent === '2025 (3)' && !option.disabled));

      let current = lab.getCurrentQuestion();
      assert('q1a-request-loads-exact-reference', current?.id === 'nzqa-2025-bach-analysis' && current.sourceSpec?.transcriptionMode === 'exact');
      assert('q1a-production-score-is-satb', d.querySelector('#score')?.dataset.layout === 'satb');
      assert('q1a-production-has-twelve-editable-boxes', d.querySelectorAll('#score .analysis-box-editable').length === 12);
      const q1aPivot = current.interaction?.slots?.find(slot => slot.label === 'Bar 8, beat 4');
      assert('q1a-production-response-slot-has-correct-return-pivot', Boolean(q1aPivot) && q1aPivot.harmonicIndex === 11, current.interaction?.slots);

      lab.showQuestion('nzqa-2025-bach-modulation');
      current = lab.getCurrentQuestion();
      assert('q1b-production-loads-exact-reference', current?.id === 'nzqa-2025-bach-modulation' && current.sourceSpec?.transcriptionMode === 'exact');
      assert('q1b-production-renders-three-brackets', d.querySelectorAll('#score .analysis-bracket').length >= 3);
      assert('q1b-production-has-full-twelve-measure-surface', d.querySelector('#score')?.dataset.measureCount === '12');
      assert('q1b-production-source-brackets-xyz', current.score.brackets.map(item => item.label).join('') === 'XYZ');

      lab.showQuestion('nzqa-2025-bach-satb');
      current = lab.getCurrentQuestion();
      assert('q1c-production-loads-paper-reference', current?.id === 'nzqa-2025-bach-satb' && current.interaction?.type === 'paper-completion');
      assert('q1c-production-paper-panel-visible', d.querySelector('#paper-completion-panel')?.hidden === false);
      assert('q1c-production-no-structured-answer-state', lab.getStructuredAnswer() == null);
      assert('q1c-production-ten-visible-paper-boxes', d.querySelectorAll('#score .analysis-box-group').length === 10);
      assert('q1c-production-six-blank-paper-choice-boxes', [...d.querySelectorAll('#score .analysis-box-group')].filter(group => !group.querySelector('.analysis-box-label')).length === 6);
      assert('q1c-production-paper-boxes-not-browser-editable', d.querySelectorAll('#score .analysis-box-editable').length === 0);
      assert('q1c-production-four-rhythm-cues', d.querySelector('#score')?.dataset.sourceRhythmCueCount === '4');
      const permissionsBefore = lab.getPlaybackPermissions();
      assert('q1c-supplied-playback-available-before-reveal', permissionsBefore.question === true && permissionsBefore.model === false, permissionsBefore);

      assert('q1c-submit-succeeds', lab.submit({skipConfirmation:true, noScroll:true}) === true);
      assert('q1c-submitted', lab.isSubmitted() === true);
      assert('q1c-model-renders-ten-labelled-boxes', d.querySelectorAll('#model-score .analysis-box-group').length === 10 && d.querySelectorAll('#model-score .analysis-box-label').length === 10);
      assert('q1c-model-print-becomes-available', d.querySelector('#print-model')?.hidden === false);
      const permissionsAfter = lab.getPlaybackPermissions();
      assert('q1c-model-playback-unlocks-after-reveal', permissionsAfter.model === true, permissionsAfter);
      finish();
    } catch (error) {
      finish(error);
    }
  });
</script>
</body>
</html>
