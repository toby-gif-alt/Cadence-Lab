<!doctype html>
<html lang="en-NZ">
  <head>
    <meta charset="utf-8" />
    <title>Cadence Lab renderer smoke test</title>
    <style>
      body { margin: 20px; font-family: sans-serif; }
      .fixture { width: 780px; margin-bottom: 24px; border: 1px solid #ddd; }
      #all-questions { position: absolute; left: -10000px; top: 0; width: 780px; }
      #results { white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <h1>Cadence Lab renderer smoke test</h1>
    <div class="fixture" id="explicit-rhythm"></div>
    <div class="fixture" id="decorations"></div>
    <div class="fixture" id="satb-question"></div>
    <div class="fixture" id="satb-model"></div>
    <div class="fixture" id="beam-regression-question"></div>
    <div class="fixture" id="beam-regression-model"></div>
    <div id="all-questions" aria-hidden="true"></div>
    <pre id="results"></pre>

    <script>
      window.smokeRuntimeErrors = [];
      window.addEventListener("error", (event) => {
        window.smokeRuntimeErrors.push(event.error?.stack || event.message);
        document.body.dataset.status = "fail";
        document.querySelector("#results").textContent = JSON.stringify({
          passed: false,
          runtimeError: event.error?.stack || event.message,
        }, null, 2);
      });
      window.addEventListener("unhandledrejection", (event) => {
        document.body.dataset.status = "fail";
        document.querySelector("#results").textContent = JSON.stringify({
          passed: false,
          runtimeError: event.reason?.stack || String(event.reason),
        }, null, 2);
      });
    </script>
    <script src="../vendor/vexflow-bravura-4.2.5.js"></script>
    <script src="../key-relationships.js?v=2026-09-interaction-14"></script>
    <script src="../question-bank.js?v=2026-09-interaction-14"></script>
    <script src="../score-renderer.js?v=2026-09-interaction-14"></script>
    <script src="../question-validator.js?v=2026-09-interaction-14"></script>
    <script>
      const renderer = window.CadenceScoreRenderer;
      const questions = window.CadenceData.questions;
      if (!window.CadenceQuestionValidator) {
        throw new Error(
          `Validator failed to initialise:\n${window.smokeRuntimeErrors.join("\n")}`
        );
      }
      const validatorReport = window.CadenceQuestionValidator.report;

      const rhythmScore = {
        key: "G major",
        keySignature: "G",
        timeSignature: "3/4",
        layout: "piano",
        measures: [
          {
            events: [
              { treble: ["B4"], bass: ["G3"], duration: "qd" },
              { treble: [], trebleRest: true, bass: ["D3"], duration: "8" },
              { treble: ["A4"], bass: ["G2"], duration: "q" },
            ],
          },
          {
            endBarline: "final",
            events: [{ treble: ["G4"], bass: ["G2"], duration: "hd" }],
          },
        ],
        ties: [{ from: 2, to: 3, staff: "bass" }],
        harmonicEvents: [
          { measure: 1, beat: 1, event: 0, analysisBox: false },
          { measure: 2, beat: 1, event: 0, analysisBox: false },
        ],
      };
      const decorationScore = {
        key: "C major → G major",
        keySignature: "C",
        timeSignature: "4/4",
        layout: "grand",
        measuresPerSystem: 1,
        measures: [
          { events: [
            { treble: ["E4", "G4", "C5"], bass: ["C3"], duration: "h" },
            { treble: ["C4", "F#4", "A4"], bass: ["D3"], duration: "h" },
          ] },
          { endBarline: "final", events: [
            { treble: ["D4", "G4", "B4"], bass: ["G2"], duration: "w" },
          ] },
        ],
        labelPosition: "top",
        brackets: [{ start: 1, end: 2, label: "X" }],
        harmonicEvents: [
          { measure: 1, beat: 1, event: 0, analysisBox: true, questionLabel: "C: I", modelLabel: "C: I", chordSymbol: "C" },
          { measure: 1, beat: 3, event: 1, analysisBox: true, modelLabel: "G: V7", chordSymbol: "D7" },
          { measure: 2, beat: 1, event: 0, analysisBox: true, modelLabel: "G: I", chordSymbol: "G" },
        ],
      };
      const satbScore = {
        key: "F major",
        keySignature: "F",
        timeSignature: "4/4",
        layout: "satb",
        completion: true,
        measures: [{ events: [
          {
            voices: { soprano: "F5", alto: "A4", tenor: "C3", bass: "F2" },
            questionVoices: { soprano: "F5", bass: "F2" },
            duration: "h",
          },
          {
            voices: { soprano: "G5", alto: "B♭4", tenor: "D3", bass: "G2" },
            questionVoices: { soprano: "G5", bass: "G2" },
            duration: "h",
          },
        ] }],
        harmonicEvents: [],
      };
      const densityScore = {
        key: "C major",
        keySignature: "C",
        timeSignature: "4/4",
        layout: "satb",
        measures: [
          { voices: {
            soprano: [{ pitch: "G4", duration: "w" }],
            alto: [{ pitch: "E4", duration: "w" }],
            tenor: [{ pitch: "C4", duration: "w" }],
            bass: [{ pitch: "C3", duration: "w" }],
          } },
          { voices: {
            soprano: ["G4", "A4", "B4", "C5", "B4", "A4", "G4", "F4"].map((pitch) => ({ pitch, duration: "8" })),
            alto: ["E4", "F4", "G4", "A4", "G4", "F4", "E4", "D4"].map((pitch) => ({ pitch, duration: "8" })),
            tenor: ["C4", "D4", "E4", "F4", "E4", "D4", "C4", "B3"].map((pitch) => ({ pitch, duration: "8" })),
            bass: ["C3", "B2", "A2", "G2", "A2", "B2", "C3", "G2"].map((pitch) => ({ pitch, duration: "8" })),
          }, endBarline: "final" },
        ],
        harmonicEvents: [],
      };
      const beamRegressionScore = {
        key: "C major",
        keySignature: "C",
        timeSignature: "4/4",
        layout: "treble",
        measures: [
          { events: [
            { treble: ["C5"], duration: "8" },
            { treble: ["D5"], duration: "8" },
            { treble: ["E5"], duration: "q" },
            { treble: ["F5"], duration: "8" },
            { treble: [], trebleRest: true, duration: "8" },
            { treble: ["G5"], duration: "q" },
          ] },
          { timeSignature: "2/2", events: [
            { treble: ["A4"], duration: "8" },
            { treble: ["B4"], duration: "8" },
            { treble: ["C5"], duration: "8" },
            { treble: ["D5"], duration: "8" },
            { treble: ["E5"], duration: "h" },
          ] },
          { timeSignature: "4/4", endBarline: "final", events: [
            { treble: ["F5"], duration: "qd" },
            { treble: [], trebleRest: true, duration: "8" },
            { treble: ["G5"], duration: "h" },
          ] },
        ],
        harmonicEvents: [],
      };

      renderer.render(document.querySelector("#explicit-rhythm"), rhythmScore);
      renderer.render(document.querySelector("#decorations"), decorationScore, {
        showAnswer: true,
      });
      renderer.render(document.querySelector("#satb-question"), satbScore);
      renderer.render(document.querySelector("#satb-model"), satbScore, {
        showAnswer: true,
      });
      renderer.render(
        document.querySelector("#beam-regression-question"),
        beamRegressionScore,
        { showAnswer: false }
      );
      renderer.render(
        document.querySelector("#beam-regression-model"),
        beamRegressionScore,
        { showAnswer: true }
      );
      const densityDesktop = document.createElement("div");
      const densityMobile = document.createElement("div");
      document.querySelector("#all-questions").append(
        densityDesktop,
        densityMobile
      );
      renderer.render(densityDesktop, densityScore, { width: 780 });
      renderer.render(densityMobile, densityScore, { width: 390 });

      let incompatibleSatbRejected = false;
      try {
        renderer.render(document.createElement("div"), {
          key: "C major",
          layout: "satb",
          measures: [{ events: [
            { treble: ["C4", "E4", "G4"], bass: ["C3"], duration: "w" },
          ] }],
          harmonicEvents: [],
        }, { width: 780 });
      } catch (error) {
        incompatibleSatbRejected = /use event\.voices/i.test(error.message);
      }

      const oldIncompleteC6 = renderer.validateChordIdentification(
        { treble: ["E4", "A4", "C5"], bass: ["C3"] },
        "C6"
      );
      const cTurnaround = questions.find(
        (question) => question.id === "jazz-c-turnaround"
      );
      const correctedC6 = cTurnaround.score.measures.at(-1).events.at(-1);
      const correctedC6Validation = renderer.validateChordIdentification(
        correctedC6,
        "C6"
      );
      const nonHarmonicFeature = questions.find(
        (question) => question.id === "feature-nonharmonic"
      );
      const featureAnnotationTargets = [1000, 780, 390].map((width) => {
        const target = document.createElement("div");
        document.querySelector("#all-questions").append(target);
        renderer.render(target, nonHarmonicFeature.score, { width });
        return target;
      });
      const neighbourMislabeledAsPassing = structuredClone(questions);
      const corruptedPassingFeature = neighbourMislabeledAsPassing.find(
        (question) => question.id === "feature-nonharmonic"
      );
      corruptedPassingFeature.score.measures[0].events[2].treble = ["G4"];
      const neighbourPassingReport =
        window.CadenceQuestionValidator.validate(neighbourMislabeledAsPassing);
      const missingAnnotationPitch = structuredClone(questions);
      missingAnnotationPitch.find(
        (question) => question.id === "feature-nonharmonic"
      ).score.noteAnnotations[0].pitch = "C5";
      const missingAnnotationPitchReport =
        window.CadenceQuestionValidator.validate(missingAnnotationPitch);
      const expectedCommercialSequence = [
        "C♯m(add9)", "Dmaj7", "Bm9", "G♯dim/B", "C♯7sus4", "C♯7",
        "F♯m", "E♯dim7", "F♯m/E", "D♯m7(♭5)", "Dmaj7",
      ];
      const commercialReference = questions.find(
        (question) => question.id === "nzqa-2024-commercial-chromatic-bass"
      );
      const commercialSequence = commercialReference.score.harmonicEvents.map(
        (event) => event.modelLabel
      );
      const eSharpDiminishedEvent = commercialReference.score.measures[6].events[0];

      const selfConsistentWrongReference = structuredClone(questions);
      const corruptedCommercial = selfConsistentWrongReference.find(
        (question) => question.id === "nzqa-2024-commercial-chromatic-bass"
      );
      corruptedCommercial.score.measures[6].events[0] = {
        treble: ["A3", "C4", "E♭4", "F♯4"],
        bass: ["F4"],
        duration: "q",
      };
      Object.assign(corruptedCommercial.score.harmonicEvents[7], {
        modelLabel: "F♯dim7/F",
        chordSymbol: "F♯dim7/F",
      });
      const corruptedCommercialReport =
        window.CadenceQuestionValidator.validate(selfConsistentWrongReference);

      const independentBachIds = [
        "nzqa-2021-bach-pivots",
        "nzqa-2022-bach-c-aminor",
        "nzqa-2023-bach-key-regions",
        "nzqa-2024-bach-analysis",
        "nzqa-2024-bach-satb",
      ];
      const independentBachReferences = independentBachIds.map((id) =>
        questions.find((question) => question.id === id)
      );
      const bachCompletion = questions.find(
        (question) => question.id === "nzqa-2024-bach-satb"
      );
      const completionTargets = bachCompletion.score.measures.slice(1);
      const completionModelHasFourParts = completionTargets.every((measure) =>
        ["soprano", "alto", "tenor", "bass"].every((voiceName) =>
          measure.voices[voiceName].some((event) => event.pitch)
        )
      );
      const completionQuestionIsBlank = completionTargets.every((measure) =>
        ["soprano", "alto", "tenor", "bass"].every(
          (voiceName) =>
            Array.isArray(measure.questionVoices[voiceName]) &&
            measure.questionVoices[voiceName].every((event) => !event.pitch)
        )
      );
      const v43Spans = bachCompletion.score.harmonicEvents.filter(
        (event) => event.questionLabel === "V⁴–³"
      );
      const leakedCompletionQuestions = structuredClone(questions);
      leakedCompletionQuestions
        .find((question) => question.id === "nzqa-2024-bach-satb")
        .score.measures[1].questionVoices.soprano = [
          { pitch: "C5", duration: "w" },
        ];
      const leakedCompletionReport =
        window.CadenceQuestionValidator.validate(leakedCompletionQuestions);

      const completionQuestionTarget = document.createElement("div");
      const completionModelTarget = document.createElement("div");
      renderer.render(completionQuestionTarget, bachCompletion.score, {
        showAnswer: false,
        width: 780,
      });
      renderer.render(completionModelTarget, bachCompletion.score, {
        showAnswer: true,
        width: 780,
      });
      const suppliedBarPitchCount = ["soprano", "alto", "tenor", "bass"]
        .reduce(
          (count, voiceName) =>
            count + bachCompletion.score.measures[0].voices[voiceName].length,
          0
        );

      const categoryRenderErrors = [];
      const layoutCheckErrors = [];
      const harmonicContractErrors = [];
      const renderedCategories = new Set();
      const referenceSystemCounts = {};
      const referenceQuestionRenders = {};
      const referenceSatbAlignmentDeltas = [];
      questions.forEach((question) => {
        [false, true].forEach((showAnswer) => {
          [1000, 780, 390].forEach((width) => {
            const target = document.createElement("div");
            document.querySelector("#all-questions").append(target);
            const layout = question.score.layout ||
              (question.category === "satb"
                ? "satb"
                : question.category === "piano"
                  ? "piano"
                  : "grand");
            try {
              renderer.render(target, question.score, {
                layout,
                showAnswer,
                width,
              });
              const expectedBoxes = question.score.harmonicEvents.filter(
                (event) => ["supplied", "editable"].includes(event.answerRole)
              ).length;
              const actualBoxes = target.querySelectorAll(".analysis-box").length;
              if (actualBoxes !== expectedBoxes) {
                harmonicContractErrors.push(
                  `${question.id} (${showAnswer ? "model" : "question"}, ${width}px): expected ${expectedBoxes} semantic boxes, found ${actualBoxes}`
                );
              }
              if (!showAnswer) {
                const editableGroups = [...target.querySelectorAll(".analysis-box-editable")];
                const expectedEditable = question.score.harmonicEvents.filter(
                  (event) => event.answerRole === "editable"
                );
                if (
                  editableGroups.length !== expectedEditable.length ||
                  editableGroups.some((group) => !group.dataset.answerSlotId)
                ) {
                  harmonicContractErrors.push(`${question.id}: editable box mapping is not one-to-one`);
                }
              }
              renderedCategories.add(question.category);
              if (independentBachIds.includes(question.id)) {
                referenceSatbAlignmentDeltas.push(
                  Number(target.dataset.maximumSatbAlignmentDelta)
                );
              }
              if (question.sourceType === "nzqa-reference" && !showAnswer) {
                referenceSystemCounts[question.id] ||= {};
                referenceSystemCounts[question.id][width] = Number(
                  target.dataset.systemCount
                );
                referenceQuestionRenders[question.id] ||= {};
                referenceQuestionRenders[question.id][width] = target;
              }
              const svg = target.querySelector("svg");
              const viewWidth = Number(svg?.getAttribute("viewBox")?.split(/\s+/)[2]);
              const bounds = svg?.getBBox();
              if (
                !svg || !bounds || bounds.x < -1 ||
                bounds.x + bounds.width > viewWidth + 1
              ) {
                layoutCheckErrors.push(
                  `${question.id} (${showAnswer ? "model" : "question"}, ${width}px): horizontal SVG overflow`
                );
              }
            } catch (error) {
              categoryRenderErrors.push(
                `${question.id} (${showAnswer ? "model" : "question"}, ${width}px): ${error.message}`
              );
            }
          });
        });
      });

      function elementsInsideViewBox(target, selector) {
        const svg = target.querySelector("svg");
        if (!svg) return false;
        const [, , width, height] = svg
          .getAttribute("viewBox")
          .split(/\s+/)
          .map(Number);
        const elements = [...svg.querySelectorAll(selector)];
        return elements.every((element) => {
          const bounds = element.getBBox();
          return bounds.x >= -0.5 && bounds.y >= -0.5 &&
            bounds.x + bounds.width <= width + 0.5 &&
            bounds.y + bounds.height <= height + 0.5;
        });
      }

      function boxesInsideViewBox(target) {
        return elementsInsideViewBox(target, ".analysis-box");
      }

      function rectanglesOverlap(first, second, padding = 0) {
        return !(
          first.x + first.width + padding <= second.x ||
          second.x + second.width + padding <= first.x ||
          first.y + first.height + padding <= second.y ||
          second.y + second.height + padding <= first.y
        );
      }

      function annotationLabelsAvoidNotation(target) {
        const svg = target.querySelector("svg");
        if (!svg) return false;
        const labels = [...svg.querySelectorAll(".note-annotation-label")];
        const obstacles = [...svg.querySelectorAll(
          ".vf-stem, .vf-beam, .vf-accidental"
        )];
        return labels.length > 0 && obstacles.length > 0 && labels.every(
          (label) => obstacles.every(
            (obstacle) => !rectanglesOverlap(label.getBBox(), obstacle.getBBox(), 1)
          )
        );
      }

      function bracketsClearStaffs(target) {
        const topStaffYs = JSON.parse(target.dataset.systemTopStaffYs || "[]");
        const brackets = [...target.querySelectorAll(".analysis-bracket")];
        return brackets.every((bracket) => {
          const systemIndex = Number(bracket.dataset.systemIndex);
          const bounds = bracket.getBBox();
          return bounds.y + bounds.height < topStaffYs[systemIndex] - 2;
        });
      }

      function directFlagPathCount(note) {
        return [...note.children].filter((child) => child.matches("path")).length;
      }

      function beamFixtureState(target) {
        const notes = [...target.querySelectorAll(".vf-stavenote")];
        const beamedQuaverIndexes = [0, 1, 6, 7, 8, 9];
        const longerValueIndexes = [2, 5, 10, 11, 13];
        const restIndexes = [4, 12];
        return {
          noteCount: notes.length,
          beamCount: target.querySelectorAll(".vf-beam").length,
          beamedFlagPaths: beamedQuaverIndexes.map((index) =>
            directFlagPathCount(notes[index])
          ),
          isolatedQuaverFlagPaths: directFlagPathCount(notes[3]),
          longerValuesRemainStemmedAndUnflagged: longerValueIndexes.every(
            (index) =>
              notes[index]?.querySelector(".vf-stem") &&
              directFlagPathCount(notes[index]) === 0
          ),
          restsRemainUnstemmed: restIndexes.every(
            (index) =>
              notes[index]?.querySelector(".vf-notehead") &&
              !notes[index]?.querySelector(".vf-stem")
          ),
          restEventCount: target.dataset.restEventCount,
          dottedEventCount: target.dataset.dottedEventCount,
        };
      }

      const rhythmTarget = document.querySelector("#explicit-rhythm");
      const decorationTarget = document.querySelector("#decorations");
      const satbQuestion = document.querySelector("#satb-question");
      const satbModel = document.querySelector("#satb-model");
      const beamQuestion = document.querySelector("#beam-regression-question");
      const beamModel = document.querySelector("#beam-regression-model");
      const beamQuestionState = beamFixtureState(beamQuestion);
      const beamModelState = beamFixtureState(beamModel);
      const valentine = questions.find(
        (question) => question.id === "nzqa-2021-valentine-techniques"
      );
      const valentineEvents = valentine.score.measures.flatMap(
        (measure) => measure.events
      );
      const referenceCounts = Object.fromEntries(
        [2021, 2022, 2023, 2024].map((year) => [
          year,
          questions.filter(
            (question) =>
              question.sourceType === "nzqa-reference" &&
              question.source.year === year
          ).length,
        ])
      );
      const densityPreferredWidths = JSON.parse(
        densityDesktop.dataset.measurePreferredWidths
      );
      const densityRenderedWidths = JSON.parse(
        densityDesktop.dataset.measureWidths
      );
      const referenceQuestionTargets = [...document.querySelectorAll(
        "#all-questions .notation-score"
      )].filter((target) =>
        target.closest("#all-questions") &&
        target.dataset.scoreMode === "question"
      );
      const assertions = {
        versionPinned: renderer.version === "4.2.5",
        bankValidatorPasses: validatorReport.valid,
        bankHasThirtyTwoQuestions: questions.length === 32,
        bankHasNoLegacyScores:
          questions.every((question) => question.score.measures) &&
          validatorReport.legacyCount === 0,
        categoryTargetsMet:
          JSON.stringify(validatorReport.categoryCounts) ===
          JSON.stringify({ analysis: 6, modulation: 6, satb: 4, piano: 4, jazz: 6, features: 6 }),
        eightReferencesAcrossAllYears:
          validatorReport.referenceCount === 8 &&
          Object.values(referenceCounts).every((count) => count >= 1),
        unevenReferenceYearsAllowed:
          referenceCounts[2024] === 3 && referenceCounts[2022] === 1,
        originalAnalysisAndJazzTextureReviewPasses:
          validatorReport.reviewWarnings.every(
            (warning) => warning.code !== "worksheet-like-texture"
          ),
        insufficientNonHarmonicContextsFlaggedForManualReview:
          validatorReport.reviewWarnings.some(
            (warning) => warning.code === "nonharmonic-context-manual-review"
          ),
        correctedGABPassesPassingValidation:
          validatorReport.musicTheoryErrors.every(
            (error) => !error.includes("feature-nonharmonic")
          ),
        GAGCannotValidateAsPassing:
          neighbourPassingReport.musicTheoryErrors.some(
            (error) =>
              error.includes("feature-nonharmonic") &&
              error.includes("G4–A4–G4") &&
              error.includes("does not support passing note")
          ),
        missingAnnotationPitchRejected:
          missingAnnotationPitchReport.musicTheoryErrors.some(
            (error) =>
              error.includes("feature-nonharmonic") &&
              error.includes("cannot find C5")
          ),
        semanticNoteAnnotationsResolveAtAllWidths:
          featureAnnotationTargets.every(
            (target) =>
              target.dataset.noteAnnotationCount === "1" &&
              target.dataset.resolvedNoteAnnotationCount === "1" &&
              target.querySelector(".note-annotation")?.dataset.pitch === "A4" &&
              target.querySelector(".note-annotation-label")?.textContent === "X"
          ),
        noteAnnotationsStayInsideSvg:
          featureAnnotationTargets.every((target) =>
            elementsInsideViewBox(target, ".note-annotation")
          ),
        noteAnnotationLabelsAvoidStemsBeamsAndAccidentals:
          featureAnnotationTargets.every(annotationLabelsAvoidNotation),
        sourceFidelityValidatorPasses:
          validatorReport.sourceFidelityErrors.length === 0,
        valentineUsesPitchSpecificAnnotations:
          valentine.score.noteAnnotations?.length === 6 &&
          !valentine.score.brackets?.length &&
          valentine.score.noteAnnotations.every(
            (annotation) => annotation.pitch && annotation.staff === "treble"
          ),
        commercialSequenceMatchesPublishedSchedule:
          JSON.stringify(commercialSequence) ===
          JSON.stringify(expectedCommercialSequence),
        eSharpDiminishedSpellingPreserved:
          eSharpDiminishedEvent.treble.includes("E#4") &&
          eSharpDiminishedEvent.bass.includes("E#2") &&
          ![...eSharpDiminishedEvent.treble, ...eSharpDiminishedEvent.bass]
            .some((pitch) => /^F(?:#|♯)?/.test(pitch)),
        sourceFidelityRejectsSelfConsistentAlternative:
          corruptedCommercialReport.musicTheoryErrors.every(
            (error) => !error.includes("nzqa-2024-commercial-chromatic-bass")
          ) &&
          corruptedCommercialReport.sourceFidelityErrors.some(
            (error) =>
              error.includes("nzqa-2024-commercial-chromatic-bass") &&
              error.includes("chordSymbols mismatch")
          ),
        bachReferencesUseIndependentVoiceStreams:
          independentBachReferences.every(
            (question) =>
              question.sourceSpec.independentSatb === true &&
              question.score.measures.every(
                (measure) =>
                  measure.voices &&
                  ["soprano", "alto", "tenor", "bass"].every(
                    (voiceName) => Array.isArray(measure.voices[voiceName])
                  )
              )
          ),
        bachCompletionContractMatchesSource:
          bachCompletion.sourceSpec.completionContract.chordsToRealise === 8 &&
          bachCompletion.sourceSpec.completionContract.harmonicIndications === 8 &&
          completionModelHasFourParts &&
          completionQuestionIsBlank,
        bachCompletionRejectsModelPitchLeak:
          leakedCompletionReport.sourceFidelityErrors.some(
            (error) =>
              error.includes("nzqa-2024-bach-satb") &&
              error.includes("leaks model voice pitches")
          ),
        bachCompletionRendersOnlySuppliedBar:
          completionQuestionTarget.querySelectorAll(".vf-stavenote").length ===
            suppliedBarPitchCount &&
          completionModelTarget.querySelectorAll(".vf-stavenote").length >
            suppliedBarPitchCount,
        v43IsOneSuppliedHarmonicSpan:
          bachCompletion.score.harmonicEvents.length === 8 &&
          bachCompletion.score.harmonicEvents.every(
            (event) => Boolean(event.questionLabel)
          ) &&
          v43Spans.length === 1 &&
          v43Spans[0].resolution?.beat === 2 &&
          v43Spans[0].resolution?.chordSymbol === "G" &&
          !bachCompletion.score.harmonicEvents.some(
            (event) => event.measure === 3 && event.beat === 2
          ),
        bothSourceTypesPresent:
          ["nzqa-reference", "original-practice"].every((sourceType) =>
            questions.some((question) => question.sourceType === sourceType)
          ),
        explicitMeasuresRendered:
          rhythmTarget.dataset.notationStructure === "explicit-measures" &&
          rhythmTarget.dataset.measureCount === "2",
        metreAndBarlinesRendered:
          rhythmTarget.querySelectorAll(".vf-timesignature").length > 0 &&
          rhythmTarget.querySelectorAll(".vf-stavebarline").length > 0,
        dottedValuesRecorded:
          rhythmTarget.dataset.dottedEventCount === "2",
        restsRecorded: rhythmTarget.dataset.restEventCount === "1",
        explicitTieRendered:
          rhythmTarget.querySelectorAll(".vf-stavetie").length > 0,
        beamRegressionHasTwoAndFourQuaverGroups:
          beamQuestionState.noteCount === 14 &&
          beamQuestionState.beamCount === 2,
        beamedQuaversDoNotRetainIndividualFlags:
          beamQuestionState.beamedFlagPaths.every((count) => count === 0),
        isolatedQuaverRetainsItsFlag:
          beamQuestionState.isolatedQuaverFlagPaths > 0,
        crotchetsAndMinimsRemainUnaffected:
          beamQuestionState.longerValuesRemainStemmedAndUnflagged,
        beamRegressionRestsRemainCorrect:
          beamQuestionState.restsRemainUnstemmed &&
          beamQuestionState.restEventCount === "2",
        beamRegressionDottedDurationRemainsCorrect:
          beamQuestionState.dottedEventCount === "1",
        questionAndModelBeamRenderingMatch:
          JSON.stringify(beamQuestionState) === JSON.stringify(beamModelState),
        harmonicEventsSeparateFromNotes:
          valentine.score.harmonicEvents.length < valentineEvents.length,
        explicitAnswerRolesPreventOrphanOrVirtualAnchorBoxes:
          harmonicContractErrors.length === 0,
        completionHarmonicBoxesAreAllSuppliedAndNeverEditable:
          questions.filter((question) => question.interaction.type === "notation-completion")
            .every((question) =>
              question.score.harmonicEvents.every((event) => event.answerRole !== "editable")
            ),
        modulationAndFeatureScoresHaveNoImplicitAnalysisBoxes:
          questions.filter((question) => ["modulation", "features"].includes(question.category))
            .every((question) =>
              question.score.harmonicEvents.every((event) => event.answerRole === "none")
            ),
        analysisBoxesDrawnAtHarmonicEvents:
          decorationTarget.querySelectorAll(".analysis-box").length === 3 &&
          decorationTarget.dataset.analysisBoxCount === "3",
        boxesRemainInsideSvg: boxesInsideViewBox(decorationTarget),
        bracketsAndTopBoxesCoexist:
          decorationTarget.querySelectorAll(".analysis-bracket").length > 0 &&
          boxesInsideViewBox(decorationTarget) &&
          elementsInsideViewBox(
            decorationTarget,
            ".analysis-bracket, .analysis-bracket-label"
          ) &&
          bracketsClearStaffs(decorationTarget),
        denseMeasuresReceiveMoreWidth:
          densityPreferredWidths[1] > densityPreferredWidths[0] * 1.5 &&
          densityRenderedWidths[1] > densityRenderedWidths[0] * 1.35,
        systemsReflowAtMobileWidth:
          Number(densityMobile.dataset.systemCount) >
            Number(densityDesktop.dataset.systemCount) &&
          Object.values(referenceSystemCounts).every(
            (counts) => counts[390] >= counts[780] && counts[780] >= counts[1000]
          ),
        rhythmicPositionsKeepMinimumClearance:
          Number(densityDesktop.dataset.minimumRhythmicGap) >= 12 &&
          Number(densityMobile.dataset.minimumRhythmicGap) >= 12,
        satbVoicesShareRhythmicTickPositions:
          Number(densityDesktop.dataset.maximumSatbAlignmentDelta) <= 0.5 &&
          Number(densityMobile.dataset.maximumSatbAlignmentDelta) <= 0.5 &&
          referenceSatbAlignmentDeltas.every((delta) => delta <= 0.5),
        referenceDecorationsStayInsideSvg:
          Object.values(referenceQuestionRenders).every((renders) =>
            Object.values(renders).every(
              (target) =>
                elementsInsideViewBox(
                  target,
                  ".analysis-box, .analysis-bracket, .analysis-bracket-label, .note-annotation"
                ) && bracketsClearStaffs(target)
            )
          ),
        nzqaChoralesShowConfiguredVoiceLabels:
          independentBachIds.every((id) =>
            Object.values(referenceQuestionRenders[id]).every(
              (target) =>
                target.querySelectorAll(".satb-voice-label").length ===
                  Number(target.dataset.systemCount) * 4
            )
          ),
        noSystemLevelHorizontalOverflow: layoutCheckErrors.length === 0,
        namedSatbUsesAllFourVoices:
          satbModel.querySelectorAll(".vf-stavenote").length === 8,
        incompatibleSatbRejected,
        completionQuestionDiffersFromModel:
          satbQuestion.querySelectorAll(".vf-stavenote").length <
          satbModel.querySelectorAll(".vf-stavenote").length,
        incompleteC6Rejected: !oldIncompleteC6.valid,
        correctedC6Accepted: correctedC6Validation.valid,
        correctedC6ContainsCGAndA:
          ["E4", "G4", "A4"].every((pitch) =>
            correctedC6.treble.includes(pitch)
          ) && correctedC6.bass.includes("C3"),
        allQuestionsRenderAtRequestedWidths:
          categoryRenderErrors.length === 0 &&
          ["analysis", "modulation", "satb", "piano", "jazz", "features"].every(
            (category) => renderedCategories.has(category)
          ),
      };
      const passed = Object.values(assertions).every(Boolean);
      document.body.dataset.status = passed ? "pass" : "fail";
      document.querySelector("#results").textContent = JSON.stringify(
        { passed, assertions, categoryRenderErrors, layoutCheckErrors, harmonicContractErrors, validatorReport },
        null,
        2
      );
    </script>
  </body>
</html>
