<!doctype html>
<html lang="en-NZ">
  <head>
    <meta charset="utf-8" />
    <title>Cadence Lab interaction smoke test</title>
    <style>
      body { margin: 20px; font-family: system-ui, sans-serif; }
      #render-fixture { position: absolute; left: -10000px; width: 780px; }
      #app-frame { position: absolute; left: -10000px; width: 1100px; height: 900px; }
      #results { white-space: pre-wrap; }
    </style>
  </head>
  <body data-status="running">
    <h1>Cadence Lab interaction smoke test</h1>
    <div id="render-fixture" aria-hidden="true"></div>
    <iframe id="app-frame" title="Cadence Lab test application" src="../index.html?question=satb-f-c&amp;v=2026-09-paper-15"></iframe>
    <pre id="results">Running…</pre>

    <script src="../vendor/vexflow-bravura-4.2.5.js"></script>
    <script src="../key-relationships.js?v=2026-09-paper-15"></script>
    <script src="../question-bank.js?v=2026-09-paper-15"></script>
    <script src="../score-renderer.js?v=2026-09-paper-15"></script>
    <script src="../question-validator.js?v=2026-09-paper-15"></script>
    <script src="../structured-answer.js?v=2026-09-paper-15"></script>
    <script src="../chord-generator.js?v=2026-09-paper-15"></script>
    <script src="../playback-engine.js?v=2026-09-paper-15"></script>
    <script>
      const results = document.querySelector("#results");
      const assertions = {};
      const details = {};

      function assert(name, condition, detail = null) {
        assertions[name] = Boolean(condition);
        if (!condition && detail != null) details[name] = detail;
      }

      function expectedError(callback, code, message) {
        try {
          callback();
          return false;
        } catch (error) {
          return error.code === code && (!message || error.message === message);
        }
      }

      function finish(error = null) {
        if (error) details.runtimeError = error.stack || String(error);
        const passed = !error && Object.values(assertions).every(Boolean);
        document.body.dataset.status = passed ? "pass" : "fail";
        results.textContent = JSON.stringify({ passed, assertions, details }, null, 2);
      }

      window.addEventListener("error", (event) => finish(event.error || event.message));
      window.addEventListener("unhandledrejection", (event) => finish(event.reason));

      document.querySelector("#app-frame").addEventListener("load", () => {
        try {
          const questions = window.CadenceData.questions;
          const structured = window.CadenceStructuredAnswer;
          const chordGenerator = window.CadenceChordGenerator;
          const keyRelationships = window.CadenceKeyRelationships;
          const playback = window.CadencePlayback;
          const renderer = window.CadenceScoreRenderer;
          const report = window.CadenceQuestionValidator.report;
          const frame = document.querySelector("#app-frame");
          const appWindow = frame.contentWindow;
          const appDocument = frame.contentDocument;

          assert("learnerTargetSelectorAndBadgeAreRemoved",
            !appDocument.querySelector("#difficulty") &&
            !appDocument.querySelector("#difficulty-chip") &&
            !appDocument.body.textContent.includes("Target: Merit")
          );

          assert("all32QuestionsHaveSpoilerAuditMetadata",
            questions.length === 32 && questions.every((question) =>
              question.internalTitle && question.studentTitle &&
              question.studentContext && question.score.studentCaption &&
              Array.isArray(question.hiddenConceptTerms)
            )
          );
          assert("validatorAcceptsStudentPresentation",
            report.valid && report.spoilerAuditErrors.length === 0,
            report.spoilerAuditErrors
          );
          assert("allQuestionsHaveUniversalAnswerInteraction",
            questions.filter((question) => question.interaction).length === 32 &&
            questions.filter((question) => question.interaction?.type === "paper-completion").length === 8 &&
            questions.filter((question) => question.score.completion)
              .every((question) => question.interaction?.type === "paper-completion") &&
            questions.every((question) => question.interaction?.type !== "notation-completion") &&
            !window.CadenceStudentAnswer
          );
          assert("harmonicAnswerRolesAreExplicitAndOneToOne",
            questions.every((question) =>
              question.score.harmonicEvents.every((event) =>
                ["supplied", "editable", "none"].includes(event.answerRole)
              ) &&
              question.score.harmonicEvents.filter((event) => event.answerRole === "editable").length ===
                (["roman-analysis", "jazz-chord-placement"].includes(question.interaction.type)
                  ? question.interaction.slots.length
                  : 0)
            )
          );

          const completionQuestions = questions.filter((question) =>
            question.interaction.type === "paper-completion"
          );
          const satbQuestion = questions.find((question) => question.id === "satb-f-c");
          const pianoQuestion = questions.find((question) => question.id === "piano-d-f");
          const bachQuestion = questions.find((question) => question.id === "nzqa-2024-bach-satb");
          assert("allEightCompletionsUseSemanticPaperContracts",
            completionQuestions.length === 8 &&
            completionQuestions.filter((question) => question.category === "satb").length === 4 &&
            completionQuestions.filter((question) => question.category === "piano").length === 4 &&
            completionQuestions.every((question) =>
              question.interaction.completionType === question.category &&
              question.interaction.completionRequirements &&
              question.interaction.selfCheck.length >= 5 &&
              !question.interaction.editableRegions
            )
          );
          const suppliedPlaybackFailures = completionQuestions.flatMap((question) => {
            const before = JSON.stringify(question.score);
            const questionTimeline = playback.buildTimeline(
              playback.questionOnlyScore(question.score), 88
            );
            const modelTimeline = playback.buildTimeline(question.score, 88);
            const valid = questionTimeline.notes.length > 0 &&
              questionTimeline.notes.length < modelTimeline.notes.length &&
              questionTimeline.totalBeats === modelTimeline.totalBeats &&
              JSON.stringify(question.score) === before;
            return valid ? [] : [question.id];
          });
          assert("everyPaperPlaybackContainsOnlyAuthoredVisibleNotes",
            suppliedPlaybackFailures.length === 0,
            suppliedPlaybackFailures
          );
          assert("paperContractDoesNotCreateAJazzRealisationCategory",
            questions.every((question) =>
              question.interaction.type !== "jazz-realisation" &&
              question.category !== "jazz-realisation"
            )
          );
          const bachQuestionScore = playback.questionOnlyScore(bachQuestion.score);
          const bachQuestionTimeline = playback.buildTimeline(bachQuestionScore, 88);
          const bachModelTimeline = playback.buildTimeline(bachQuestion.score, 88);
          assert("questionOnlyPlaybackContainsNoHiddenBachCompletion",
            bachQuestionTimeline.notes.length > 0 &&
            bachQuestionTimeline.notes.every((note) => note.measure === 1) &&
            bachModelTimeline.notes.some((note) => note.measure > 1)
          );
          const pianoQuestionScore = playback.questionOnlyScore(pianoQuestion.score);
          const pianoQuestionTimeline = playback.buildTimeline(pianoQuestionScore, 88);
          const pianoModelTimeline = playback.buildTimeline(pianoQuestion.score, 88);
          assert("questionOnlyPlaybackUsesVisiblePianoPartsWithoutInference",
            pianoQuestionTimeline.notes.length < pianoModelTimeline.notes.length &&
            pianoQuestionTimeline.notes.filter((note) => note.measure > 1)
              .every((note) => note.staff === "treble") &&
            pianoQuestionTimeline.totalBeats === pianoModelTimeline.totalBeats
          );
          const timelineFixture = {
            timeSignature: "4/4",
            measures: [{ events: [
              { treble: ["C4", "E4"], bass: ["C3"], duration: "qd" },
              { treble: [], trebleRest: true, bass: [], bassRest: true, duration: "8" },
              { treble: ["G4"], bass: ["G2"], duration: "h" },
            ] }],
          };
          const timeline = playback.buildTimeline(timelineFixture, 80);
          assert("authoredPlaybackRetainsChordsRestsAndDottedDurations",
            timeline.notes.length === 5 &&
            timeline.notes.filter((note) => note.startBeat === 0)
              .every((note) => note.durationBeats === 1.5) &&
            timeline.notes.filter((note) => note.startBeat === 2).length === 2 &&
            timeline.totalBeats === 4
          );

          const analysisQuestion = questions.find((question) => question.id === "analysis-c-g");
          let analysisState = structured.create(analysisQuestion);
          const analysisSlot = analysisQuestion.interaction.slots[0];
          analysisState = structured.setSlot(analysisState, analysisSlot.id, {
            analyses: [{
              key: { root: "C", mode: "major" }, degree: "IV",
              quality: "major", extent: "triad", inversion: "root",
            }],
          });
          const responseScore = structured.scoreWithResponses(analysisQuestion, analysisState);
          assert("romanResponsesRemainSeparateAndRenderIntoTheirExactSlot",
            analysisQuestion.score.harmonicEvents[analysisSlot.harmonicIndex].questionLabel == null &&
            responseScore.harmonicEvents[analysisSlot.harmonicIndex].questionLabel === "C: IV" &&
            analysisQuestion.score.harmonicEvents[2].modelLabel === "C: I / G: IV"
          );
          const pivotValue = {
            analyses: [
              { key: { root: "C", mode: "major" }, degree: "I", quality: "major", extent: "triad", inversion: "root" },
              { key: { root: "G", mode: "major" }, degree: "IV", quality: "major", extent: "triad", inversion: "root" },
            ],
          };
          assert("romanBuilderSupportsDualPivotAnalysisAndNzqaInversions",
            structured.formatValue(pivotValue, "roman-analysis") === "C: I / G: IV" &&
            structured.formatRomanAnalysis({ degree: "V", quality: "major", extent: "seventh", inversion: "d" }) === "V⁷d"
          );
          const ordinaryRomanSlot = analysisQuestion.interaction.slots.find(
            (slot) => !slot.allowDualAnalysis
          );
          const pivotRomanSlot = analysisQuestion.interaction.slots.find(
            (slot) => slot.allowDualAnalysis
          );
          let constrainedRomanState = structured.create(analysisQuestion);
          constrainedRomanState = structured.setSlot(constrainedRomanState, ordinaryRomanSlot.id, {
            analyses: [
              { degree: "V", quality: "major", extent: "triad", inversion: "d" },
              { degree: "IV", quality: "major", extent: "triad", inversion: "root" },
            ],
          });
          assert("ordinaryRomanSlotsRejectDualAnalysisAndTriadD",
            constrainedRomanState.slots[ordinaryRomanSlot.id].analyses.length === 1 &&
            constrainedRomanState.slots[ordinaryRomanSlot.id].analyses[0].inversion === "root"
          );
          constrainedRomanState = structured.setSlot(constrainedRomanState, pivotRomanSlot.id, pivotValue);
          assert("pivotRomanSlotsRetainTwoAnalyses",
            constrainedRomanState.slots[pivotRomanSlot.id].analyses.length === 2
          );
          constrainedRomanState = structured.setSlot(constrainedRomanState, ordinaryRomanSlot.id, {
            analyses: [{ degree: "V", quality: "major", extent: "seventh", inversion: "d" }],
          });
          assert("seventhChordsCanStoreInversionD",
            constrainedRomanState.slots[ordinaryRomanSlot.id].analyses[0].inversion === "d"
          );
          constrainedRomanState = structured.setSlot(constrainedRomanState, ordinaryRomanSlot.id, {
            analyses: [{ degree: "V", quality: "major", extent: "triad", inversion: "d" }],
          });
          assert("switchingSeventhToTriadSanitisesInversionD",
            constrainedRomanState.slots[ordinaryRomanSlot.id].analyses[0].inversion === "root"
          );
          constrainedRomanState = structured.setSlot(constrainedRomanState, ordinaryRomanSlot.id, {
            analyses: [{ degree: "II", quality: "half-diminished", extent: "triad", inversion: "d" }],
          });
          assert("halfDiminishedTriadsAreSanitisedToSevenths",
            constrainedRomanState.slots[ordinaryRomanSlot.id].analyses[0].extent === "seventh" &&
            constrainedRomanState.slots[ordinaryRomanSlot.id].analyses[0].inversion === "d"
          );
          assert("halfDiminishedFormatsWithASeventh",
            structured.formatRomanAnalysis({
              degree: "II", quality: "half-diminished", extent: "triad", inversion: "root",
            }) === "iiø⁷"
          );
          constrainedRomanState = structured.setSlot(constrainedRomanState, ordinaryRomanSlot.id, {
            analyses: [{ degree: "VII", quality: "diminished", extent: "triad", inversion: "root" }],
          });
          assert("diminishedTriadsRemainAllowed",
            constrainedRomanState.slots[ordinaryRomanSlot.id].analyses[0].extent === "triad" &&
            structured.formatValue(constrainedRomanState.slots[ordinaryRomanSlot.id], "roman-analysis") === "vii°"
          );
          let advancingRomanState = structured.create(analysisQuestion);
          const romanSlotIds = analysisQuestion.interaction.slots.map((slot) => slot.id);
          advancingRomanState = structured.setSlot(advancingRomanState, romanSlotIds[0], {
            analyses: [{ degree: "I", quality: "major", extent: "triad", inversion: "root" }],
          });
          advancingRomanState = structured.advanceToNextUnanswered(advancingRomanState, romanSlotIds);
          assert("romanAutoAdvanceSelectsNextUnansweredSlot",
            advancingRomanState.activeSlotId === romanSlotIds[1]
          );
          const semanticJazzExamples = [
            [{ root: "C", formula: "major" }, "C"],
            [{ root: "C", formula: "minor-ninth" }, "Cm9"],
            [{ root: "C", formula: "minor-add-nine" }, "Cm(add9)"],
            [{ root: "C", formula: "minor-ninth-major-seventh" }, "Cm9(maj7)"],
            [{ root: "C", formula: "minor-nine-add-six" }, "Cm9(add6)"],
            [{ root: "C♯", formula: "dominant-seven-sus-four" }, "C♯7sus4"],
            [{ root: "C", formula: "six-add-nine", bass: "E" }, "C6(add9)/E"],
            [{ root: "D", formula: "dominant-thirteenth", bass: "F♯" }, "D13/F♯"],
            [{ root: "E", formula: "dominant-sharp-nine", bass: "G♯" }, "E7♯9/G♯"],
            [{ root: "B", formula: "half-diminished", bass: "D" }, "Bm7♭5/D"],
          ];
          assert("semanticJazzFormatterAvoidsInvalidConcatenation",
            semanticJazzExamples.every(([value, expected]) =>
              structured.formatJazzChord(value) === expected
            ) && structured.JAZZ_FORMULAS.length >= 27
          );
          const authoredJazzQuestions = questions.filter((question) =>
            question.interaction.type === "jazz-chord-placement"
          );
          const authoredJazzAnswers = authoredJazzQuestions.flatMap((question) =>
            question.interaction.slots.flatMap((slot) =>
              slot.acceptedAnswers.map((answer) => ({
                questionId: question.id,
                slotId: slot.id,
                label: typeof answer === "string" ? answer : answer.label,
              }))
            )
          );
          const unrepresentableJazzAnswers = authoredJazzAnswers.filter(({ label }) => {
            const parsed = structured.parseJazzChordSymbol(label);
            return !parsed || structured.formatJazzChord(parsed) !== label;
          });
          assert("everyAuthoredJazzAnswerHasAnExactSemanticRepresentation",
            unrepresentableJazzAnswers.length === 0,
            unrepresentableJazzAnswers
          );
          assert("nzqa2021And2024ReferenceSymbolsAreExplicitSemanticAcceptanceCases",
            ["nzqa-2021-valentine-techniques", "nzqa-2024-commercial-chromatic-bass"]
              .flatMap((questionId) => questions.find((question) =>
                question.id === questionId
              ).sourceSpec.chordSymbols)
              .every((label) => {
                const parsed = structured.parseJazzChordSymbol(label);
                return parsed && structured.formatJazzChord(parsed) === label;
              }) &&
            ["Cm9(maj7)", "Cm9(add6)", "C♯m(add9)", "C♯7sus4", "Dm7(♭5)"]
              .every((label) => ["nzqa-2021-valentine-techniques", "nzqa-2024-commercial-chromatic-bass"]
                .flatMap((questionId) => questions.find((question) =>
                  question.id === questionId
                ).sourceSpec.chordSymbols)
                .includes(label))
          );

          const generatedEntry = (key, root, formula) => chordGenerator.catalog.find(
            (entry) => entry.key === key && entry.root === root && entry.formula === formula
          );
          const identityFixture = (key, root, formula, bass) => {
            const entry = generatedEntry(key, root, formula);
            return chordGenerator.createIdentityFixture(entry, {
              bass,
              seed: `${key}-${root}-${formula}-${bass}`,
            });
          };
          const pitchSpellings = (event) => [...event.treble, ...event.bass].map(
            (pitch) => pitch.replace(/-?\d+$/, "")
          );
          const identityIsValid = (fixture) => chordGenerator.validateHarmonicIdentity(
            fixture.event,
            { key: fixture.key, keySignature: fixture.keySignature }
          ).valid;
          const cSixth = identityFixture("C major", "C", "sixth", "C");
          const dMinorSixth = identityFixture("D minor", "D", "minor-sixth", "D");
          const bHalfDiminished = identityFixture("A minor", "B", "half-diminished", "D");
          const eSuspended = identityFixture("G major", "E", "suspended-four", "E");
          const gSuspended = identityFixture("C major", "G", "suspended-four", "D");
          assert("generatedSixthAndMinorSeventhIdentitiesAreNotAutomaticallyInterchangeable",
            JSON.stringify(cSixth.acceptedAnswers) === JSON.stringify(["C6"]) &&
            !cSixth.acceptedAnswers.includes("Am7/C") &&
            JSON.stringify(dMinorSixth.acceptedAnswers) === JSON.stringify(["Dm6"]) &&
            !dMinorSixth.acceptedAnswers.includes("Bm7♭5/D") &&
            [cSixth, dMinorSixth].every(identityIsValid)
          );
          assert("generatedHalfDiminishedIdentityDoesNotAutomaticallyAcceptMinorSixth",
            JSON.stringify(bHalfDiminished.acceptedAnswers) === JSON.stringify(["Bm7♭5/D"]) &&
            !bHalfDiminished.acceptedAnswers.includes("Dm6") &&
            identityIsValid(bHalfDiminished)
          );
          assert("generatedSuspensionsDoNotAcceptAutomaticAlternateRoots",
            JSON.stringify(eSuspended.acceptedAnswers) === JSON.stringify(["Esus4"]) &&
            !eSuspended.acceptedAnswers.includes("Asus2/E") &&
            JSON.stringify(gSuspended.acceptedAnswers) === JSON.stringify(["Gsus4/D"]) &&
            !gSuspended.acceptedAnswers.includes("Csus2/D") &&
            [eSuspended, gSuspended].every(identityIsValid)
          );
          assert("constrainedGeneratedVoicingsEmphasiseTheIntendedRoot",
            [cSixth, dMinorSixth, bHalfDiminished, eSuspended, gSuspended].every((fixture) => {
              const spellings = pitchSpellings(fixture.event);
              const identity = fixture.entry.harmonicIdentity;
              const rootCount = spellings.filter((pitch) => pitch === fixture.entry.root).length;
              return rootCount >= identity.minRootOccurrences &&
                identity.competingRoots.every((root) =>
                  rootCount > spellings.filter((pitch) => pitch === root).length
                );
            })
          );
          const competitorHeavyIdentity = structuredClone(cSixth.event);
          competitorHeavyIdentity.treble.push("A5");
          competitorHeavyIdentity.generatedSourceSpec.voicing.treble.push("A5");
          competitorHeavyIdentity.generatedSourceSpec.voicing.competingRootOccurrences.A = 2;
          const competitorHeavyValidation = chordGenerator.validateHarmonicIdentity(
            competitorHeavyIdentity,
            { key: cSixth.key, keySignature: cSixth.keySignature }
          );
          assert("harmonicIdentityRejectsAnEquallyEmphasisedCompetingRoot",
            !competitorHeavyValidation.valid &&
            competitorHeavyValidation.errors.some((error) =>
              error.includes("not stronger than competing root A")
            )
          );
          const misspelledIdentity = structuredClone(cSixth.event);
          misspelledIdentity.treble[0] = "B#4";
          assert("harmonicIdentityValidationPreservesExactSpelling",
            !chordGenerator.validateHarmonicIdentity(misspelledIdentity, {
              key: cSixth.key,
              keySignature: cSixth.keySignature,
            }).valid
          );

          const generatedVariants = Array.from({ length: 500 }, (_, index) =>
            chordGenerator.create(`smoke-${index}`)
          );
          const generatedKeys = new Set(
            chordGenerator.catalog.map((entry) => entry.key)
          );
          const generatedSymbols = chordGenerator.catalog.map((entry) =>
            structured.formatJazzChord({ root: entry.root.replaceAll("#", "♯").replaceAll("b", "♭"), formula: entry.formula })
          );
          assert("seededChordGeneratorValidatesHundredsOfVariants",
            generatedVariants.every((question) => chordGenerator.validateVariant(question)) &&
            chordGenerator.catalog.every((entry) => chordGenerator.validateCatalogEntry(entry)) &&
            generatedKeys.size === 8 &&
            generatedVariants.every((question) =>
              question.sourceType === "generated-practice" &&
              question.category === "chord-identification" &&
              question.interaction.slots.length === 4 &&
              question.interaction.slots.every((slot) => slot.acceptedAnswers.length === 1) &&
              question.score.measures.every((measure) =>
                Boolean(measure.keySignature) && Boolean(measure.keyLabel)
              ) &&
              question.variantId.startsWith("CID-") &&
              !/NZQA reference/i.test(question.source.acknowledgement)
            )
          );
          const roundTripOriginal = chordGenerator.create("visible-variant-round-trip");
          const roundTripRestored = chordGenerator.createFromVariantId(roundTripOriginal.variantId);
          assert("visibleVariantIdRecreatesIdenticalQuestionData",
            JSON.stringify(roundTripOriginal) === JSON.stringify(roundTripRestored) &&
            JSON.stringify(roundTripOriginal.score.measures.map((measure) => ({
              keySignature: measure.keySignature,
              keyLabel: measure.keyLabel,
              treble: measure.events[0].treble,
              bass: measure.events[0].bass,
              voicing: measure.events[0].generatedSourceSpec.voicing,
              accepted: measure.events[0].acceptableChordSymbols,
            }))) === JSON.stringify(roundTripRestored.score.measures.map((measure) => ({
              keySignature: measure.keySignature,
              keyLabel: measure.keyLabel,
              treble: measure.events[0].treble,
              bass: measure.events[0].bass,
              voicing: measure.events[0].generatedSourceSpec.voicing,
              accepted: measure.events[0].acceptableChordSymbols,
            })))
          );
          const deliberateAmbiguity = chordGenerator.createIdentityFixture(
            chordGenerator.intentionalAmbiguityFixture,
            { bass: "A", seed: "intentional-ambiguity" }
          );
          const deliberateAmbiguityQuestion = {
            id: "intentional-ambiguity-fixture",
            interaction: {
              type: "jazz-chord-placement",
              slots: [{
                id: "ambiguous-chord",
                label: "Ambiguous chord",
                acceptedAnswers: deliberateAmbiguity.acceptedAnswers.map((label) => ({ label })),
              }],
              bank: [],
            },
          };
          let alternativeState = structured.create(deliberateAmbiguityQuestion);
          alternativeState = structured.setSlot(alternativeState, "ambiguous-chord", {
            label: deliberateAmbiguity.acceptedAnswers[1],
            source: "builder",
          });
          assert("intentionalAmbiguityFixtureSupportsEveryExplicitlyDeclaredAnalysis",
            deliberateAmbiguity.acceptedAnswers.length === 2 &&
            deliberateAmbiguity.acceptedAnswers.includes("Dm6/A") &&
            deliberateAmbiguity.acceptedAnswers.includes("Bm7♭5/A") &&
            identityIsValid(deliberateAmbiguity) &&
            structured.comparison(deliberateAmbiguityQuestion, alternativeState).slots[0].status === "matches"
          );
          assert("generatedVocabularyIncludesAdvancedRequiredChords",
            ["D13", "G7♭9", "C6", "C6(add9)", "Fmaj9", "Bm7♭5", "E7♯9", "Esus4", "Gsus4"]
              .every((symbol) => generatedSymbols.includes(symbol))
          );
          const requiredSlashExamples = [
            ["D", "dominant-thirteenth", "F#", "D13/F♯"],
            ["C", "sixth", "E", "C6/E"],
            ["F", "major-ninth", "A", "Fmaj9/A"],
            ["B", "half-diminished", "D", "Bm7♭5/D"],
            ["E", "dominant-sharp-nine", "G#", "E7♯9/G♯"],
          ];
          assert("generatedVocabularyIncludesRequestedHighComplexitySlashChords",
            requiredSlashExamples.every(([root, formula, bass, symbol]) => {
              const entry = chordGenerator.catalog.find((candidate) =>
                candidate.root === root && candidate.formula === formula && candidate.allowedBasses.includes(bass)
              );
              return entry && structured.formatJazzChord({
                root: root.replaceAll("#", "♯").replaceAll("b", "♭"),
                formula,
                bass: bass.replaceAll("#", "♯").replaceAll("b", "♭"),
              }) === symbol;
            })
          );
          assert("alteredDominantUsesExactTheoreticalSharpNineSpelling",
            chordGenerator.catalog.find((entry) =>
              entry.root === "E" && entry.formula === "dominant-sharp-nine"
            )?.tones.includes("F##")
          );

          const modulationQuestion = questions.find((question) => question.id === "nzqa-2023-bach-key-regions");
          let modulationState = structured.create(modulationQuestion);
          modulationState = structured.setField(modulationState, "x-key", { label: "E♭ major" });
          modulationState = structured.setField(modulationState, "x-relationship", { label: "relative major of the subdominant" });
          modulationState = structured.setEvidence(modulationState, "B♭7–E♭ cadence");
          assert("modulationUsesStructuredKeyRelationshipAndEvidenceState",
            modulationState.fields["x-key"].label === "E♭ major" &&
            modulationState.fields["x-relationship"].label === "relative major of the subdominant" &&
            modulationState.evidence === "B♭7–E♭ cadence"
          );
          const requiredKeyRelationshipCases = [
            ["B♭ major", "E♭ major", "subdominant", "IV"],
            ["B♭ major", "F major", "dominant", "V"],
            ["G minor", "B♭ major", "relative major", "III"],
            ["G minor", "C minor", "subdominant", "iv"],
            ["G minor", "E♭ major", "submediant", "VI"],
            ["G minor", "F major", "subtonic", "VII"],
            ["A major", "F♯ minor", "relative minor", "vi"],
            ["A major", "D major", "subdominant", "IV"],
            ["A major", "E major", "dominant", "V"],

                const context = `${question.id}/${slot.id}/${label}`;
                const slotButton = appDocument.querySelector(`[data-slot-id="${slot.id}"]`);
                if (!slotButton || !chord) {
                  authoredBuilderFailures.push(`${context}: slot or semantic chord unavailable`);
                  return;
                }
                slotButton.click();
                const rootMatch = /^([A-G])([♯♭]?)$/.exec(chord.root);
                if (!rootMatch ||
                    !chooseBuilderValue("[data-chord-root]", rootMatch[1], context) ||
                    !chooseBuilderValue("[data-chord-root-accidental]", rootMatch[2], context) ||
                    !chooseBuilderValue("[data-chord-quality]", chord.quality, context) ||
                    !chooseBuilderValue("[data-chord-extension]", chord.extension, context)) return;
                if (chord.alteration && chord.quality === "dominant") {
                  if (!chooseBuilderValue("[data-chord-alteration]", chord.alteration, context)) return;
                }
                if (chord.addition) {
                  if (!chooseBuilderValue("[data-chord-addition]", chord.addition, context)) return;
                }
                if (chord.suspension) {
                  if (!chooseBuilderValue("[data-chord-suspension]", chord.suspension, context)) return;
                }
                if (!chooseBuilderValue("[data-chord-bass]", chord.bass, context)) return;
                const preview = appDocument.querySelector("[data-jazz-preview]").textContent;
                if (preview !== label) {
                  authoredBuilderFailures.push(`${context}: preview formatted ${preview}`);
                  return;
                }
                appDocument.querySelector("[data-place-built]").click();
                const state = appWindow.CadenceLab.getStructuredAnswer();
                const placed = structured.formatValue(
                  state.slots[slot.id], question.interaction.type
                );
                const status = structured.comparison(question, state).slots.find(
                  (candidate) => candidate.id === slot.id
                )?.status;
                if (placed !== label || status !== "matches") {
                  authoredBuilderFailures.push(`${context}: placed ${placed}, status ${status}`);
                }
              });
            });
          });
          assert("standardBuilderProducesEveryAuthoredAcceptedJazzAnswer",
            authoredBuilderFailures.length === 0,
            authoredBuilderFailures
          );
          appWindow.CadenceLab.showQuestion("nzqa-2024-commercial-chromatic-bass");
          chooseBuilderValue("[data-chord-root]", "C", "C♯m(add9)");
          chooseBuilderValue("[data-chord-root-accidental]", "♯", "C♯m(add9)");
          chooseBuilderValue("[data-chord-quality]", "minor", "C♯m(add9)");
          chooseBuilderValue("[data-chord-extension]", "triad", "C♯m(add9)");
          chooseBuilderValue("[data-chord-addition]", "add9", "C♯m(add9)");
          assert("standardBuilderAlsoConstructsTheSupplied2024MinorAddNine",
            appDocument.querySelector("[data-jazz-preview]").textContent === "C♯m(add9)"
          );

          appWindow.CadenceLab.showGeneratedQuestion("ui-generated-smoke");
          const generatedQuestionAtLoad = appWindow.CadenceLab.getCurrentQuestion();
          const renderedMeasureKeyLabels = [...appDocument.querySelectorAll(
            "#score .measure-key-label"
          )].map((label) => label.textContent);
          assert("generatedPracticeHasFourIndependentChordBoxesAndVariantId",
            appDocument.querySelector("#category").value === "chord-identification" &&
            appDocument.querySelector("#source-type").value === "generated-practice" &&
            appDocument.querySelector("#variant-chip").textContent.startsWith("CID-") &&
            appDocument.querySelectorAll(".analysis-box-editable").length === 4
          );
          assert("everyGeneratedMeasureShowsItsOwnKeyContext",
            JSON.stringify(renderedMeasureKeyLabels) === JSON.stringify(
              generatedQuestionAtLoad.score.measures.map((measure) => measure.keyLabel)
            ) &&
            JSON.stringify(JSON.parse(appDocument.querySelector("#score").dataset.measureKeyLabels)) ===
              JSON.stringify(renderedMeasureKeyLabels) &&
            generatedQuestionAtLoad.score.measures.every((measure) =>
              Boolean(measure.keySignature)
            )
          );
          assert("semanticJazzBuilderIsPrimaryAndHintBankStartsClosed",
            appDocument.querySelector("[data-chord-quality]") &&
            appDocument.querySelector("[data-chord-extension]") &&
            appDocument.querySelector("[data-chord-alteration]") &&
            appDocument.querySelector("[data-chord-suspension]") &&
            !appDocument.querySelector(".hint-bank").open &&
            appDocument.querySelector(".hint-bank summary").textContent.includes("Need a hint")
          );
          const jazzRoot = appDocument.querySelector("[data-chord-root]");
          const jazzQuality = appDocument.querySelector("[data-chord-quality]");
          const jazzExtension = appDocument.querySelector("[data-chord-extension]");
          const jazzAlteration = appDocument.querySelector("[data-chord-alteration]");
          const jazzBass = appDocument.querySelector("[data-chord-bass]");
          jazzRoot.value = "C";
          jazzRoot.dispatchEvent(new appWindow.Event("change", { bubbles: true }));
          jazzQuality.value = "dominant";
          jazzQuality.dispatchEvent(new appWindow.Event("change", { bubbles: true }));
          jazzExtension.value = "7";
          jazzExtension.dispatchEvent(new appWindow.Event("change", { bubbles: true }));
          jazzAlteration.value = "b9";
          jazzAlteration.dispatchEvent(new appWindow.Event("change", { bubbles: true }));
          jazzBass.value = "B♭";
          jazzBass.dispatchEvent(new appWindow.Event("change", { bubbles: true }));
          assert("semanticJazzBuilderFormatsCompatibleChordParts",
            appDocument.querySelector("[data-jazz-preview]").textContent === "C7♭9/B♭"
          );
          appDocument.querySelector("[data-place-built]").click();
          const builtJazzAnswer = appWindow.CadenceLab.getStructuredAnswer().slots["generated-chord-1"];
          assert("semanticJazzBuilderStoresStructuredChordAndAutoAdvances",
            builtJazzAnswer.chord.formula === "dominant-flat-nine" &&
            builtJazzAnswer.chord.root === "C" && builtJazzAnswer.chord.bass === "B♭" &&
            appWindow.CadenceLab.getStructuredAnswer().activeSlotId === "generated-chord-2"
          );
          const generatedStateBeforeHint = JSON.stringify(appWindow.CadenceLab.getStructuredAnswer().slots);
          appDocument.querySelector(".hint-bank summary").click();
          assert("openingJazzHintBankDoesNotResetAnswers",
            JSON.stringify(appWindow.CadenceLab.getStructuredAnswer().slots) === generatedStateBeforeHint
          );
          const generatedQuestionForComparison = appWindow.CadenceLab.getCurrentQuestion();
          const acceptedFirstLabel = generatedQuestionForComparison.interaction.slots[0].acceptedAnswers[0].label;
          appDocument.querySelector('[data-slot-id="generated-chord-1"]').click();
          [...appDocument.querySelectorAll("[data-token-id]")].find(
            (button) => button.textContent === acceptedFirstLabel && !button.disabled
          )?.click();
          appWindow.CadenceLab.submit({ skipConfirmation: true, noScroll: true });
          assert("singleIdentityGeneratedComparisonUsesIntendedAnalysisLanguage",
            appDocument.querySelector("#student-comparison").textContent.includes("matches intended analysis") &&
            appDocument.querySelector("#student-comparison").textContent.includes("Intended analysis") &&
            !appDocument.querySelector("#student-comparison").textContent.includes("Accepted analyses")
          );

          appWindow.CadenceLab.showQuestion("nzqa-2024-commercial-chromatic-bass");
          assert("loveIsCommercialKeepsStructuredJazzInteraction",
            appDocument.querySelector("#paper-completion-panel").hidden &&
            !appDocument.querySelector("#structured-response-panel").hidden &&
            appDocument.querySelector("[data-chord-quality]") &&
            appDocument.querySelectorAll(".analysis-box-editable").length === 10 &&
            appDocument.querySelector(".hint-bank")
          );

          finish();
        } catch (error) {
          finish(error);
        }
      }, { once: true });
    </script>
  </body>
</html>
