<!doctype html>
<html lang="en-NZ">
<head>
  <meta charset="utf-8" />
  <title>Cadence Lab production interaction smoke test</title>
  <style>
    body { margin: 20px; font-family: system-ui, sans-serif; }
    #app-frame { position: absolute; left: -10000px; top: 0; width: 1100px; height: 1000px; }
    #results { white-space: pre-wrap; }
  </style>
</head>
<body data-status="running">
  <h1>Cadence Lab production interaction smoke test</h1>
  <iframe id="app-frame" title="Cadence Lab production app" src="../index.html?question=nzqa-2025-bach-analysis&amp;v=2026-09-score-ui-22"></iframe>
  <pre id="results">Running…</pre>
<script>
  const frame = document.querySelector('#app-frame');
  const results = document.querySelector('#results');
  const assertions = {};
  const details = {};
  const assert = (name, condition, detail = null) => {
    assertions[name] = Boolean(condition);
    if (!condition && detail != null) details[name] = detail;
  };
  const nextTurn = w => new Promise(resolve => w.setTimeout(resolve, 0));
  function finish(error = null) {
    if (error) details.runtimeError = error.stack || String(error);
    const passed = !error && Object.values(assertions).every(Boolean);
    document.body.dataset.status = passed ? 'pass' : 'fail';
    results.textContent = JSON.stringify({passed, assertions, details}, null, 2);
  }
  addEventListener('error', event => finish(event.error || event.message));
  addEventListener('unhandledrejection', event => finish(event.reason));

  frame.addEventListener('load', async () => {
    try {
      const w = frame.contentWindow;
      const d = frame.contentDocument;
      const lab = w.CadenceLab;
      const structured = w.CadenceStructuredAnswer;
      const generator = w.CadenceChordGenerator;
      const relationships = w.CadenceKeyRelationships;
      const playback = w.CadencePlayback;
      const validator = w.CadenceQuestionValidator?.report;
      const display = w.CadenceScoreDisplay;
      const questions = lab?.questions || [];

      assert('production-apis-load', Boolean(lab && structured && generator && relationships && playback && display));
      assert('production-validator-is-valid', validator?.valid === true, validator?.errors);
      assert('production-display-audit-is-valid', display?.initialAudit?.valid === true, display?.initialAudit?.errors);
      assert('student-target-selector-remains-removed', !d.querySelector('#difficulty') && !d.querySelector('#difficulty-chip'));
      assert('all-authored-questions-have-spoiler-presentation-metadata', questions.length >= 50 && questions.every(question =>
        question.internalTitle && question.studentTitle && question.studentContext &&
        question.score?.studentCaption && Array.isArray(question.hiddenConceptTerms)
      ));

      const nzqaRefs = questions.filter(question => question.sourceType === 'nzqa-reference');
      const practiceRefs = questions.filter(question => question.sourceType === 'practice-assessment-reference');
      assert('current-source-counts-are-production-counts', nzqaRefs.length === 8 && practiceRefs.length === 0, {nzqa:nzqaRefs.length, practice:practiceRefs.length});
      assert('every-retained-reference-is-exact', nzqaRefs.every(question => question.sourceSpec?.transcriptionMode === 'exact'));
      assert('three-exact-2025-references-are-live', nzqaRefs.filter(question => question.source?.year === 2025).length === 3);

      const sourceSelect = d.querySelector('#source-type');
      const yearSelect = d.querySelector('#source-year');
      const yearField = d.querySelector('#source-year-field');
      const yearLabel = d.querySelector('#source-year-label');
      const categorySelect = d.querySelector('#category');
      const change = (control, value) => {
        control.value = value;
        control.dispatchEvent(new w.Event('change', {bubbles:true}));
      };

      change(sourceSelect, 'mixed');
      assert('mixed-sources-hide-and-clear-reference-year', yearField.hidden && yearSelect.value === '');
      change(sourceSelect, 'original-practice');
      assert('original-practice-hides-reference-year', yearField.hidden && yearSelect.value === '');
      change(sourceSelect, 'nzqa-reference');
      const yearOptions = Object.fromEntries([...yearSelect.options].map(option => [option.value || 'all', {text:option.textContent, disabled:option.disabled}]));
      assert('nzqa-filter-shows-current-examination-years', !yearField.hidden && yearLabel.textContent === 'Examination year' &&
        yearOptions.all.text === 'All years (8)' && yearOptions['2025'].text === '2025 (3)' && !yearOptions['2025'].disabled,
        yearOptions);

      change(sourceSelect, 'nzqa-reference');
      change(yearSelect, '2024');
      change(categorySelect, 'piano');
      assert('empty-category-fallback-preserves-source-and-year', categorySelect.value === 'mixed' &&
        lab.getCurrentQuestion()?.sourceType === 'nzqa-reference' && lab.getCurrentQuestion()?.source?.year === 2024,
        {category:categorySelect.value, question:lab.getCurrentQuestion()?.id});

      const q1a = questions.find(question => question.id === 'nzqa-2025-bach-analysis');
      const pivotSlot = q1a.interaction.slots.find(slot => slot.allowDualAnalysis);
      const normalSlot = q1a.interaction.slots.find(slot => !slot.allowDualAnalysis);
      const twoAnalyses = {analyses:[
        {degree:'V', quality:'major', extent:'triad', inversion:'root'},
        {degree:'I', quality:'major', extent:'triad', inversion:'root'},
      ]};
      let romanState = structured.create(q1a);
      romanState = structured.setSlot(romanState, pivotSlot.id, twoAnalyses);
      assert('pivot-slot-allows-two-analyses', romanState.slots[pivotSlot.id].analyses.length === 2);
      romanState = structured.setSlot(romanState, normalSlot.id, twoAnalyses);
      assert('ordinary-roman-slot-is-limited-to-one-analysis', romanState.slots[normalSlot.id].analyses.length === 1);
      const halfDiminished = structured.setSlot(structured.create(q1a), normalSlot.id, {analyses:[{
        degree:'II', quality:'half-diminished', extent:'triad', inversion:'d'
      }]});
      assert('half-diminished-is-normalised-as-a-seventh', halfDiminished.slots[normalSlot.id].analyses[0].extent === 'seventh');
      const initialRoman = structured.create(q1a);
      const placedRoman = structured.setSlot(initialRoman, q1a.interaction.slots[0].id, {analyses:[{degree:'I',quality:'major',extent:'triad',inversion:'root'}]});
      const advancedRoman = structured.advanceToNextUnanswered(placedRoman, q1a.interaction.slots.map(slot => slot.id));
      assert('roman-entry-auto-advances-to-next-unanswered-position', advancedRoman.activeSlotId === q1a.interaction.slots[1].id, advancedRoman.activeSlotId);

      const relationshipChecks = [
        ['G minor','B♭ major','relative major'],
        ['G minor','E♭ major','submediant'],
        ['B♭ major','E♭ major','subdominant'],
        ['A major','F♯ minor','relative minor'],
      ];
      assert('semantic-key-relationships-remain-correct', relationshipChecks.every(([home, local, expected]) => {
        const result = relationships.relationshipBetween(home, local);
        return result.canonical === expected || result.acceptedLabels.includes(expected);
      }), relationshipChecks.map(([home,local]) => relationships.relationshipBetween(home,local)));

      const authoredJazz = questions.filter(question => question.interaction?.type === 'jazz-chord-placement');
      const unsupportedJazz = [];
      authoredJazz.forEach(question => question.interaction.slots.forEach(slot =>
        slot.acceptedAnswers.forEach(answer => {
          try { structured.parseJazzChordSymbol(answer.label); }
          catch (error) { unsupportedJazz.push({question:question.id, label:answer.label, error:error.message}); }
        })
      ));
      assert('every-authored-jazz-answer-is-constructible-by-standard-builder', unsupportedJazz.length === 0, unsupportedJazz);

      const paperQuestions = questions.filter(question => question.interaction?.type === 'paper-completion');
      assert('paper-completion-taxonomy-is-only-satb-or-piano', paperQuestions.length > 0 && paperQuestions.every(question =>
        ['satb','piano'].includes(question.category) && question.interaction.completionType === question.category &&
        !question.interaction.editableRegions && !question.score.harmonicEvents.some(event => event.answerRole === 'editable')
      ));
      const paper = paperQuestions.find(question => question.id === 'nzqa-2025-bach-satb') || paperQuestions[0];
      lab.showQuestion(paper.id);
      let permissions = lab.getPlaybackPermissions();
      assert('paper-workflow-allows-supplied-playback-before-reveal', permissions.question === true && permissions.model === false, permissions);
      assert('paper-submit-reveals-separate-model', lab.submit({skipConfirmation:true,noScroll:true}) === true);
      await nextTurn(w);
      permissions = lab.getPlaybackPermissions();
      assert('paper-model-playback-unlocks-after-reveal', permissions.model === true && d.querySelector('#model-score-wrap')?.hidden === false, permissions);

      lab.showQuestion('nzqa-2025-bach-analysis');
      assert('analysis-score-starts-with-visible-clear-blank-boxes',
        d.querySelector('#score')?.dataset.blankEditableAnalysisBoxCount === '12' &&
        d.querySelector('#score')?.dataset.barNumbers === '[5,6,7,8,9]' &&
        [...d.querySelectorAll('#score .analysis-box-editable')].every(group => group.dataset.boxShiftY === '18')
      );
      assert('analysis-submit-reveals', lab.submit({skipConfirmation:true,noScroll:true}) === true);
      await nextTurn(w);
      assert('roman-analysis-retains-separate-model-and-does-not-rewrite-main-score',
        d.querySelector('#score')?.dataset.scoreMode === 'question' &&
        d.querySelector('#model-score-wrap')?.hidden === false &&
        d.querySelector('#model-score')?.childNodes.length > 0
      );

      lab.showQuestion('nzqa-2025-bach-modulation');
      assert('modulation-submit-reveals', lab.submit({skipConfirmation:true,noScroll:true}) === true);
      await nextTurn(w);
      assert('only-key-modulation-hides-redundant-second-score',
        d.querySelector('#score')?.dataset.scoreMode === 'question' &&
        d.querySelector('#model-score-wrap')?.hidden === true
      );

      const generatorProblems = [];
      for (let index = 0; index < 60; index += 1) {
        const generated = generator.create(`interaction-smoke-${index}`);
        if (!generator.validateVariant(generated)) {
          generatorProblems.push({index, kind:'invalid-variant'});
          continue;
        }
        const recreated = generator.createFromVariantId(generated.variantId);
        if (recreated.variantId !== generated.variantId ||
            JSON.stringify(recreated.score.measures) !== JSON.stringify(generated.score.measures)) {
          generatorProblems.push({index, kind:'variant-round-trip'});
        }
      }
      assert('generated-chord-variants-remain-valid-and-reproducible', generatorProblems.length === 0, generatorProblems.slice(0,10));

      finish();
    } catch (error) {
      finish(error);
    }
  });
</script>
</body>
</html>
