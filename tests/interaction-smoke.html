<!doctype html>
<html lang="en-NZ">
  <head>
    <meta charset="utf-8" />
    <title>Cadence Lab interaction smoke test</title>
    <style>
      body { margin: 20px; font-family: system-ui, sans-serif; }
      #render-fixture { position: absolute; left: -10000px; width: 780px; }
      #app-frame { position: absolute; left: -10000px; width: 1100px; height: 900px; }
      #results { white-space: pre-wrap; }
    </style>
  </head>
  <body data-status="running">
    <h1>Cadence Lab interaction smoke test</h1>
    <div id="render-fixture" aria-hidden="true"></div>
    <iframe id="app-frame" title="Cadence Lab test application" src="../index.html?question=satb-f-c"></iframe>
    <pre id="results">Running…</pre>

    <script src="../vendor/vexflow-bravura-4.2.5.js"></script>
    <script src="../question-bank.js?v=2026-09-structured-1"></script>
    <script src="../score-renderer.js?v=2026-09-structured-1"></script>
    <script src="../question-validator.js?v=2026-09-structured-1"></script>
    <script src="../student-answer.js?v=2026-09-interaction-5"></script>
    <script src="../structured-answer.js?v=2026-09-structured-1"></script>
    <script src="../playback-engine.js?v=2026-09-interaction-5"></script>
    <script>
      const results = document.querySelector("#results");
      const assertions = {};
      const details = {};

      function assert(name, condition, detail = null) {
        assertions[name] = Boolean(condition);
        if (!condition && detail != null) details[name] = detail;
      }

      function expectedError(callback, code, message) {
        try {
          callback();
          return false;
        } catch (error) {
          return error.code === code && (!message || error.message === message);
        }
      }

      function finish(error = null) {
        if (error) details.runtimeError = error.stack || String(error);
        const passed = !error && Object.values(assertions).every(Boolean);
        document.body.dataset.status = passed ? "pass" : "fail";
        results.textContent = JSON.stringify({ passed, assertions, details }, null, 2);
      }

      window.addEventListener("error", (event) => finish(event.error || event.message));
      window.addEventListener("unhandledrejection", (event) => finish(event.reason));

      document.querySelector("#app-frame").addEventListener("load", () => {
        try {
          const questions = window.CadenceData.questions;
          const answer = window.CadenceStudentAnswer;
          const structured = window.CadenceStructuredAnswer;
          const playback = window.CadencePlayback;
          const renderer = window.CadenceScoreRenderer;
          const report = window.CadenceQuestionValidator.report;

          assert("all32QuestionsHaveSpoilerAuditMetadata",
            questions.length === 32 && questions.every((question) =>
              question.internalTitle && question.studentTitle &&
              question.studentContext && question.score.studentCaption &&
              Array.isArray(question.hiddenConceptTerms)
            )
          );
          assert("validatorAcceptsStudentPresentation",
            report.valid && report.spoilerAuditErrors.length === 0,
            report.spoilerAuditErrors
          );
          assert("allQuestionsHaveUniversalAnswerInteraction",
            questions.filter((question) => question.interaction).length === 32 &&
            questions.filter((question) => question.interaction?.type === "notation-completion").length === 8 &&
            questions.filter((question) => question.score.completion)
              .every((question) => question.interaction?.type === "notation-completion")
          );
          assert("harmonicAnswerRolesAreExplicitAndOneToOne",
            questions.every((question) =>
              question.score.harmonicEvents.every((event) =>
                ["supplied", "editable", "none"].includes(event.answerRole)
              ) &&
              question.score.harmonicEvents.filter((event) => event.answerRole === "editable").length ===
                (["roman-analysis", "jazz-chord-placement"].includes(question.interaction.type)
                  ? question.interaction.slots.length
                  : 0)
            )
          );

          const satbQuestion = questions.find((question) => question.id === "satb-f-c");
          const pianoQuestion = questions.find((question) => question.id === "piano-d-f");
          const satbSourceBefore = JSON.stringify(satbQuestion);
          let satbState = answer.create(satbQuestion);
          satbState = answer.insert(satbState, satbQuestion, {
            voice: "alto", measure: 1, pitches: ["C4"], duration: "w",
          });
          satbState = answer.insert(satbState, satbQuestion, {
            voice: "alto", measure: 2, pitches: ["C4"], duration: "q",
          });
          const secondId = satbState.selectedId;
          const firstId = satbState.measures[0].voices.alto[0].id;
          satbState = answer.select(satbState, firstId);
          satbState = answer.toggleTie(satbState, satbQuestion);
          assert("contiguousCrossBarlineTiePasses",
            satbState.measures[0].voices.alto[0].tieToNext === true
          );
          let contiguousTieState = answer.create(satbQuestion);
          contiguousTieState = answer.insert(contiguousTieState, satbQuestion, {
            voice: "alto", measure: 1, beat: 1,
            pitches: ["C4"], duration: "q",
          });
          const contiguousTieStart = contiguousTieState.selectedId;
          contiguousTieState = answer.insert(contiguousTieState, satbQuestion, {
            voice: "alto", measure: 1, beat: 2,
            pitches: ["C4"], duration: "q",
          });
          contiguousTieState = answer.select(contiguousTieState, contiguousTieStart);
          contiguousTieState = answer.toggleTie(contiguousTieState, satbQuestion);
          assert("contiguousSamePitchTieWithinBarPasses",
            contiguousTieState.measures[0].voices.alto[0].tieToNext === true
          );

          let gapTieState = answer.create(satbQuestion);
          gapTieState = answer.insert(gapTieState, satbQuestion, {
            voice: "alto", measure: 1, beat: 1,
            pitches: ["C4"], duration: "q",
          });
          const gapTieStart = gapTieState.selectedId;
          gapTieState = answer.insert(gapTieState, satbQuestion, {
            voice: "alto", measure: 1, beat: 3,
            pitches: ["C4"], duration: "q",
          });
          gapTieState = answer.select(gapTieState, gapTieStart);
          assert("samePitchSeparatedByGapCannotTie",
            expectedError(
              () => answer.toggleTie(gapTieState, satbQuestion),
              "noncontiguous-tie"
            )
          );

          let crossBarRestState = answer.create(satbQuestion);
          crossBarRestState = answer.insert(crossBarRestState, satbQuestion, {
            voice: "alto", measure: 1, beat: 1,
            pitches: ["C4"], duration: "w",
          });
          const crossBarRestStart = crossBarRestState.selectedId;
          crossBarRestState = answer.insert(crossBarRestState, satbQuestion, {
            voice: "alto", measure: 2, beat: 1,
            pitches: [], duration: "q", rest: true,
          });
          crossBarRestState = answer.insert(crossBarRestState, satbQuestion, {
            voice: "alto", measure: 2, beat: 2,
            pitches: ["C4"], duration: "q",
          });
          crossBarRestState = answer.select(crossBarRestState, crossBarRestStart);
          assert("crossBarlineTieWithInitialRestFails",
            expectedError(
              () => answer.toggleTie(crossBarRestState, satbQuestion),
              "noncontiguous-tie"
            )
          );
          satbState = answer.select(satbState, secondId);
          satbState = answer.applyAccidental(satbState, satbQuestion, "#");
          assert("accidentalEditingPreservesSpelling",
            satbState.measures[1].voices.alto[0].pitches[0] === "C#4"
          );

          let overfillState = answer.create(satbQuestion);
          overfillState = answer.insert(overfillState, satbQuestion, {
            voice: "alto", measure: 1, pitches: ["A3"], duration: "h",
          });
          overfillState = answer.insert(overfillState, satbQuestion, {
            voice: "alto", measure: 1, pitches: ["B3"], duration: "q",
          });
          assert("underfilledMeasuresAreAllowed",
            answer.usedBeats(overfillState.measures[0].voices.alto) === 3
          );
          assert("measureOverfillHasExactRemainingBeatFeedback",
            expectedError(
              () => answer.insert(overfillState, satbQuestion, {
                voice: "alto", measure: 1, pitches: ["C4"], duration: "h",
              }),
              "measure-overfill",
              "That note exceeds the remaining 1 beat in this bar."
            )
          );
          assert("suppliedVoicesAndBarsAreLocked",
            expectedError(
              () => answer.insert(overfillState, satbQuestion, {
                voice: "soprano", measure: 1, pitches: ["F5"], duration: "q",
              }),
              "locked-region"
            )
          );

          let toolState = answer.create(satbQuestion);
          toolState = answer.insert(toolState, satbQuestion, {
            voice: "tenor", measure: 1, pitches: [], duration: "8", rest: true,
          });
          toolState = answer.insert(toolState, satbQuestion, {
            voice: "tenor", measure: 1, pitches: ["F3"], duration: "8d",
          });
          assert("restsAndDottedDurationsAreSemanticEvents",
            toolState.measures[0].voices.tenor[0].rest === true &&
            toolState.measures[0].voices.tenor[1].duration === "8d" &&
            answer.durationBeats("8d") === 0.75
          );
          assert("editorSupportsTheCompleteRequiredDurationPalette",
            [["w", 4], ["h", 2], ["q", 1], ["8", 0.5], ["16", 0.25]]
              .every(([duration, beats]) => answer.durationBeats(duration) === beats)
          );
          assert("horizontalGeometrySnapsToDurationAwareOnsets",
            answer.snapBeatAtX({
              x: 200, startX: 0, endX: 400, capacity: 4,
              duration: "q", denominator: 4,
            }) === 3 &&
            answer.snapBeatAtX({
              x: 150, startX: 0, endX: 400, capacity: 4,
              duration: "8", denominator: 4,
            }) === 2.5 &&
            answer.snapBeatAtX({
              x: 125, startX: 0, endX: 400, capacity: 4,
              duration: "16", denominator: 4,
            }) === 2.25 &&
            answer.snapBeatAtX({
              x: 300, startX: 0, endX: 600, capacity: 6,
              duration: "8", denominator: 8,
            }) === 4 &&
            answer.durationBeats("8", 8) === 1 &&
            answer.durationBeats("16", 8) === 0.5
          );
          let timedState = answer.create(satbQuestion);
          timedState = answer.insert(timedState, satbQuestion, {
            voice: "alto", measure: 1, beat: 3,
            pitches: ["C4"], duration: "q",
          });
          const timedMaterialized = answer.materializeTimedStream(
            timedState.measures[0].voices.alto
          );
          assert("tappingBeatThreeCreatesABeatThreeOnset",
            timedState.measures[0].voices.alto[0].beat === 3 &&
            timedState.cursors.alto.beat === 4 &&
            timedMaterialized[0].rest === true &&
            timedMaterialized[0].generatedGap === true &&
            timedMaterialized[0].duration === "h" &&
            timedMaterialized[1].beat === 3
          );
          const timedScore = answer.composeScore(satbQuestion, timedState);
          assert("rhythmicGapsComposeAsExplicitRests",
            timedScore.measures[0].voices.alto[0].rest === true &&
            timedScore.measures[0].voices.alto[0].duration === "h" &&
            timedScore.measures[0].voices.alto[1].editorNoteId === timedState.selectedId
          );
          assert("overlappingStudentEventsAreRejected",
            expectedError(
              () => answer.insert(timedState, satbQuestion, {
                voice: "alto", measure: 1, beat: 2,
                pitches: ["D4"], duration: "h",
              }),
              "event-overlap"
            )
          );
          const timedId = timedState.selectedId;
          const durationEdited = answer.updateSelected(
            answer.select(timedState, timedId), satbQuestion, { duration: "8" }
          );
          assert("editingAnExistingEventPreservesItsOnset",
            durationEdited.measures[0].voices.alto.length === 1 &&
            durationEdited.measures[0].voices.alto[0].beat === 3
          );
          const chordAtBeatThree = answer.insert(timedState, satbQuestion, {
            voice: "alto", measure: 1, beat: 3,
            pitches: ["E4"], duration: "q", addToChord: true,
          });
          assert("addToChordIsTheOnlySameVoiceOverlapException",
            chordAtBeatThree.measures[0].voices.alto.length === 1 &&
            chordAtBeatThree.measures[0].voices.alto[0].pitches.join(",") === "C4,E4"
          );
          const chordToneRemoved = answer.removePitchFromSelected(
            chordAtBeatThree, satbQuestion, "E4"
          );
          assert("individualChordTonesCanBeRemoved",
            chordToneRemoved.measures[0].voices.alto[0].pitches.join(",") === "C4"
          );
          let fallbackChordState = answer.create(satbQuestion);
          fallbackChordState = answer.insert(fallbackChordState, satbQuestion, {
            voice: "alto", measure: 1, beat: 3,
            pitches: ["E4"], duration: "q", addToChord: true,
          });
          assert("addChordToneFallsBackToNormalInsertionAtEmptyOnset",
            fallbackChordState.measures[0].voices.alto.length === 1 &&
            fallbackChordState.measures[0].voices.alto[0].beat === 3 &&
            fallbackChordState.measures[0].voices.alto[0].pitches[0] === "E4"
          );
          assert("keySignaturesAndMeasureAccidentalsPreserveSpelling",
            answer.spellPitchAtStaffPosition({
              staff: "treble", stepsFromTopLine: 0, keySignature: "G",
            }) === "F#5" &&
            answer.spellPitchAtStaffPosition({
              staff: "treble", stepsFromTopLine: 0, keySignature: "G",
              priorEvents: [{ pitches: ["Fn5"] }],
            }) === "Fn5"
          );
          const accidentalQuestion = JSON.parse(JSON.stringify(pianoQuestion));
          accidentalQuestion.id = "accidental-context-fixture";
          accidentalQuestion.score.keySignature = "G";
          accidentalQuestion.score.timeSignature = "4/4";
          accidentalQuestion.score.measures = [
            { expectedBeats: 4, events: [
              { qTreble: ["Fn5"], qBass: [], duration: "q" },
              { qTreble: [], qBass: [], duration: "q" },
              { qTreble: [], qBass: [], duration: "q" },
              { qTreble: [], qBass: [], duration: "q" },
            ] },
            { expectedBeats: 4, events: [
              { qTreble: [], qBass: [], duration: "w" },
            ] },
          ];
          accidentalQuestion.interaction.editableRegions = [{
            measures: [1, 2], voices: ["treble"],
          }];
          let accidentalState = answer.create(accidentalQuestion);
          const suppliedNaturalContext = answer.visibleAccidentalContext(
            accidentalQuestion, accidentalState,
            { measure: 1, beat: 2, staff: "treble" }
          );
          assert("suppliedNaturalCancelsKeySignatureWithinBar",
            suppliedNaturalContext.some((event) => event.supplied && event.pitches[0] === "Fn5") &&
            answer.spellPitchAtStaffPosition({
              staff: "treble", stepsFromTopLine: 0, keySignature: "G",
              insertionBeat: 2, priorEvents: suppliedNaturalContext,
            }) === "Fn5"
          );
          accidentalState = answer.insert(accidentalState, accidentalQuestion, {
            voice: "treble", measure: 1, beat: 2,
            pitches: ["F#5"], duration: "q",
          });
          const studentCarryContext = answer.visibleAccidentalContext(
            accidentalQuestion, accidentalState,
            { measure: 1, beat: 3, staff: "treble" }
          );
          assert("studentAccidentalCarriesLaterWithinBar",
            answer.spellPitchAtStaffPosition({
              staff: "treble", stepsFromTopLine: 0, keySignature: "G",
              insertionBeat: 3, priorEvents: studentCarryContext,
            }) === "F#5"
          );
          const nextBarContext = answer.visibleAccidentalContext(
            accidentalQuestion, accidentalState,
            { measure: 2, beat: 1, staff: "treble" }
          );
          assert("accidentalContextResetsAtBarline",
            nextBarContext.length === 0 &&
            answer.spellPitchAtStaffPosition({
              staff: "treble", stepsFromTopLine: 0, keySignature: "G",
              insertionBeat: 1, priorEvents: nextBarContext,
            }) === "F#5"
          );
          assert("accidentalCarryIsOctaveSpecific",
            answer.spellPitchAtStaffPosition({
              staff: "treble", stepsFromTopLine: 0, keySignature: "G",
              insertionBeat: 3,
              priorEvents: [{ beat: 1, pitches: ["Fn4"] }],
            }) === "F#5"
          );
          assert("exactChromaticSpellingRemainsIntact",
            answer.spellPitchAtStaffPosition({
              staff: "treble", stepsFromTopLine: 1, keySignature: "C",
              insertionBeat: 3,
              priorEvents: [{ beat: 1, pitches: ["E#5"] }],
            }) === "E#5"
          );
          function applyKeySignaturePitch(keySignature, initialPitch) {
            const fixture = JSON.parse(JSON.stringify(satbQuestion));
            fixture.id = `key-signature-${keySignature}-${initialPitch}`;
            fixture.score.keySignature = keySignature;
            let state = answer.create(fixture);
            state = answer.insert(state, fixture, {
              voice: "alto", measure: 1, beat: 1,
              pitches: [initialPitch], duration: "q",
            });
            state = answer.applyAccidental(state, fixture, "");
            const semanticPitch = state.measures[0].voices.alto[0].pitches[0];
            const renderedPitch = answer.composeScore(fixture, state)
              .measures[0].voices.alto[0].pitch;
            const playbackPitch = playback.buildTimeline(
              answer.scoreForPlayback(fixture, state, "student"), 88
            ).notes[0].pitch;
            return { semanticPitch, renderedPitch, playbackPitch };
          }
          const gMajorKeyPitch = applyKeySignaturePitch("G", "Fn5");
          const fMajorKeyPitch = applyKeySignaturePitch("F", "Bn4");
          const cMajorKeyPitch = applyKeySignaturePitch("C", "F#5");
          assert("useKeySignatureResolvesGMajorFSharp",
            Object.values(gMajorKeyPitch).every((pitch) => pitch === "F#5")
          );
          assert("useKeySignatureResolvesFMajorBFlat",
            Object.values(fMajorKeyPitch).every((pitch) => pitch === "Bb4")
          );
          assert("useKeySignatureResolvesCMajorFNatural",
            Object.values(cMajorKeyPitch).every((pitch) => pitch === "F5")
          );
          const history = new answer.History(answer.create(satbQuestion));
          history.commit(toolState);
          const undone = history.undo();
          const redone = history.redo();
          assert("undoAndRedoRoundTripSemanticState",
            !undone.measures[0].voices.tenor &&
            redone.measures[0].voices.tenor.length === 2
          );
          const deleted = answer.deleteSelected(toolState, satbQuestion);
          assert("deleteRemovesOnlyTheSelectedStudentEvent",
            deleted.measures[0].voices.tenor.length === 1
          );

          let pianoState = answer.create(pianoQuestion);
          pianoState = answer.insert(pianoState, pianoQuestion, {
            voice: "bass", measure: 2, pitches: ["D3"], duration: "q",
          });
          const cursorAfterOnset = JSON.stringify(pianoState.cursors.bass);
          pianoState = answer.insert(pianoState, pianoQuestion, {
            voice: "bass", measure: 2, beat: 1,
            pitches: ["A3"], duration: "q", addToChord: true,
          });
          assert("addToChordBuildsASingleRhythmicOnset",
            pianoState.measures[1].voices.bass.length === 1 &&
            pianoState.measures[1].voices.bass[0].pitches.length === 2 &&
            JSON.stringify(pianoState.cursors.bass) === cursorAfterOnset
          );
          assert("questionAndModelDataRemainImmutable",
            JSON.stringify(satbQuestion) === satbSourceBefore
          );
          const submittedState = answer.setSubmitted(pianoState);
          assert("submittedAnswersAreLocked",
            submittedState.submitted && expectedError(
              () => answer.insert(submittedState, pianoQuestion, {
                voice: "bass", pitches: ["F3"], duration: "q",
              }),
              "answer-locked"
            )
          );

          const composedSatb = answer.composeScore(satbQuestion, satbState);
          const satbFixture = document.createElement("div");
          document.querySelector("#render-fixture").append(satbFixture);
          renderer.render(satbFixture, composedSatb, { width: 780 });
          assert("studentAndLockedNotesShareTheNormalRenderer",
            satbFixture.querySelectorAll(".student-note").length >= 2 &&
            satbFixture.querySelectorAll(".locked-note").length > 0 &&
            satbFixture.querySelectorAll(".editor-hit-target").length === 6
          );
          assert("satbVoiceStemDirectionsRemainIndependent",
            ["soprano", "alto", "tenor", "bass"].every((voice) =>
              composedSatb.measures.every((measure) => Array.isArray(measure.voices[voice]))
            ) && Number(satbFixture.dataset.maximumSatbAlignmentDelta) <= 0.5
          );

          const timelineScore = {
            timeSignature: "4/4",
            measures: [
              { staffVoices: {
                treble: [{ role: "melody", events: [
                  { pitches: ["C4", "E4"], duration: "q", tieToNext: true },
                  { pitches: ["C4", "E4"], duration: "q" },
                  { pitches: ["G4"], duration: "qd" },
                  { pitches: ["A4"], duration: "8" },
                ] }],
                bass: [{ role: "bass", events: [
                  { rest: true, duration: "q" },
                  { pitches: ["C3"], duration: "h" },
                  { rest: true, duration: "q" },
                ] }],
              } },
              { staffVoices: {
                treble: [{ role: "melody", events: [
                  { pitches: ["B4"], duration: "w" },
                ] }],
                bass: [{ role: "bass", events: [
                  { pitches: ["C3"], duration: "w" },
                ] }],
              } },
            ],
          };
          const timeline60 = playback.buildTimeline(timelineScore, 60);
          const timeline120 = playback.buildTimeline(timelineScore, 120);
          const tiedC = timeline60.notes.find((note) => note.pitch === "C4");
          assert("timelineSupportsChordsRestsDotsAndTies",
            timeline60.notes.filter((note) => note.startBeat === 0).length === 2 &&
            tiedC.durationBeats === 2 &&
            !timeline60.notes.some((note) => note.staff === "bass" && note.startBeat === 0) &&
            timeline60.notes.some((note) => note.pitch === "G4" && note.durationBeats === 1.5)
          );
          assert("tempoScalesTimelineWithoutChangingNotes",
            timeline60.durationSeconds === timeline120.durationSeconds * 2 &&
            timeline60.notes.length === timeline120.notes.length
          );
          assert("timelineKeepsVoicesSynchronizedByMeasure",
            timeline60.measureStarts.join(",") === "0,4" &&
            timeline60.notes.some((note) => note.pitch === "B4" && note.startBeat === 4) &&
            timeline60.notes.some((note) => note.pitch === "C3" && note.startBeat === 4)
          );
          const forcedGapTieState = JSON.parse(JSON.stringify(gapTieState));
          forcedGapTieState.measures[0].voices.alto[0].tieToNext = true;
          const gapTieTimeline = playback.buildTimeline(
            answer.scoreForPlayback(satbQuestion, forcedGapTieState, "student"), 60
          );
          const separatedCs = gapTieTimeline.notes.filter(
            (note) => note.pitch === "C4" && note.voice === "alto"
          );
          assert("playbackDoesNotSustainThroughGeneratedGap",
            separatedCs.length === 2 &&
            separatedCs[0].startBeat === 0 && separatedCs[0].durationBeats === 1 &&
            separatedCs[1].startBeat === 2 && separatedCs[1].durationBeats === 1
          );

          const studentOnly = playback.buildTimeline(
            answer.scoreForPlayback(pianoQuestion, pianoState, "student"), 88
          );
          const sourceOnly = playback.buildTimeline(
            answer.scoreForPlayback(pianoQuestion, pianoState, "question"), 88
          );
          const inContext = playback.buildTimeline(
            answer.scoreForPlayback(pianoQuestion, pianoState, "context"), 88
          );
          assert("studentPlaybackContainsOnlyAuthoredNotes",
            studentOnly.notes.length === 2 &&
            studentOnly.notes.every((note) => ["D3", "A3"].includes(note.pitch))
          );
          assert("contextPlaybackCombinesSourceAndStudent",
            sourceOnly.notes.length > 0 &&
            inContext.notes.length === sourceOnly.notes.length + studentOnly.notes.length
          );

          const analysisQuestion = questions.find((question) => question.id === "analysis-c-g");
          let analysisState = structured.create(analysisQuestion);
          const analysisSlot = analysisQuestion.interaction.slots[0];
          analysisState = structured.setSlot(analysisState, analysisSlot.id, {
            analyses: [{
              key: { root: "C", mode: "major" }, degree: "IV",
              quality: "major", extent: "triad", inversion: "root",
            }],
          });
          const responseScore = structured.scoreWithResponses(analysisQuestion, analysisState);
          assert("romanResponsesRemainSeparateAndRenderIntoTheirExactSlot",
            analysisQuestion.score.harmonicEvents[analysisSlot.harmonicIndex].questionLabel == null &&
            responseScore.harmonicEvents[analysisSlot.harmonicIndex].questionLabel === "C: IV" &&
            analysisQuestion.score.harmonicEvents[2].modelLabel === "C: I / G: IV"
          );
          const pivotValue = {
            analyses: [
              { key: { root: "C", mode: "major" }, degree: "I", quality: "major", extent: "triad", inversion: "root" },
              { key: { root: "G", mode: "major" }, degree: "IV", quality: "major", extent: "triad", inversion: "root" },
            ],
          };
          assert("romanBuilderSupportsDualPivotAnalysisAndNzqaInversions",
            structured.formatValue(pivotValue, "roman-analysis") === "C: I / G: IV" &&
            structured.formatRomanAnalysis({ degree: "V", quality: "major", extent: "seventh", inversion: "d" }) === "V⁷d"
          );
          const ordinaryRomanSlot = analysisQuestion.interaction.slots.find(
            (slot) => !slot.allowDualAnalysis
          );
          const pivotRomanSlot = analysisQuestion.interaction.slots.find(
            (slot) => slot.allowDualAnalysis
          );
          let constrainedRomanState = structured.create(analysisQuestion);
          constrainedRomanState = structured.setSlot(constrainedRomanState, ordinaryRomanSlot.id, {
            analyses: [
              { degree: "V", quality: "major", extent: "triad", inversion: "d" },
              { degree: "IV", quality: "major", extent: "triad", inversion: "root" },
            ],
          });
          assert("ordinaryRomanSlotsRejectDualAnalysisAndTriadD",
            constrainedRomanState.slots[ordinaryRomanSlot.id].analyses.length === 1 &&
            constrainedRomanState.slots[ordinaryRomanSlot.id].analyses[0].inversion === "root"
          );
          constrainedRomanState = structured.setSlot(constrainedRomanState, pivotRomanSlot.id, pivotValue);
          assert("pivotRomanSlotsRetainTwoAnalyses",
            constrainedRomanState.slots[pivotRomanSlot.id].analyses.length === 2
          );
          constrainedRomanState = structured.setSlot(constrainedRomanState, ordinaryRomanSlot.id, {
            analyses: [{ degree: "V", quality: "major", extent: "seventh", inversion: "d" }],
          });
          assert("seventhChordsCanStoreInversionD",
            constrainedRomanState.slots[ordinaryRomanSlot.id].analyses[0].inversion === "d"
          );
          constrainedRomanState = structured.setSlot(constrainedRomanState, ordinaryRomanSlot.id, {
            analyses: [{ degree: "V", quality: "major", extent: "triad", inversion: "d" }],
          });
          assert("switchingSeventhToTriadSanitisesInversionD",
            constrainedRomanState.slots[ordinaryRomanSlot.id].analyses[0].inversion === "root"
          );

          const modulationQuestion = questions.find((question) => question.id === "nzqa-2023-bach-key-regions");
          let modulationState = structured.create(modulationQuestion);
          modulationState = structured.setField(modulationState, "x-key", { label: "E♭ major" });
          modulationState = structured.setField(modulationState, "x-relationship", { label: "relative major of the subdominant" });
          modulationState = structured.setEvidence(modulationState, "B♭7–E♭ cadence");
          assert("modulationUsesStructuredKeyRelationshipAndEvidenceState",
            modulationState.fields["x-key"].label === "E♭ major" &&
            modulationState.fields["x-relationship"].label === "relative major of the subdominant" &&
            modulationState.evidence === "B♭7–E♭ cadence"
          );

          const commercial = questions.find((question) => question.id === "nzqa-2024-commercial-chromatic-bass");
          const commercialStateA = structured.create(commercial);
          const commercialStateB = structured.create(commercial);
          const commercialExpected = commercial.interaction.slots.map((slot) => slot.acceptedAnswers[0].label);
          const commercialBank = commercial.interaction.bank.map((token) => token.label);
          const multiplicity = (items, value) => items.filter((item) => item === value).length;
          assert("jazzBankIsDeterministicWithExactAnswerMultiplicityAndDistractors",
            commercialStateA.bank.map((token) => token.id).join(",") === commercialStateB.bank.map((token) => token.id).join(",") &&
            [...new Set(commercialExpected)].every((label) => multiplicity(commercialBank, label) === multiplicity(commercialExpected, label)) &&
            commercialBank.length > commercialExpected.length && commercialBank.includes("F♯dim7/F")
          );
          let jazzState = commercialStateA;
          const firstJazzSlot = commercial.interaction.slots[0].id;
          const secondJazzSlot = commercial.interaction.slots[1].id;
          const firstToken = jazzState.bank.find((token) => token.label === commercialExpected[0]);
          const secondToken = jazzState.bank.find((token) => token.label === commercialExpected[1]);
          jazzState = structured.placeToken(jazzState, firstJazzSlot, firstToken.id);
          jazzState = structured.placeToken(jazzState, secondJazzSlot, secondToken.id);
          jazzState = structured.placeToken(jazzState, secondJazzSlot, firstToken.id);
          const swapped = jazzState.slots[firstJazzSlot]?.tokenId === secondToken.id &&
            jazzState.slots[secondJazzSlot]?.tokenId === firstToken.id;
          jazzState = structured.returnToken(jazzState, secondJazzSlot);
          assert("jazzPlacementSupportsReplaceSwapReturnAndReset",
            swapped && jazzState.slots[secondJazzSlot] === null &&
            Object.values(structured.reset(jazzState).slots).every((value) => value === null)
          );
          const acceptedJazzState = structured.setSlot(
            commercialStateA, firstJazzSlot, { label: commercialExpected[0], source: "builder" }
          );
          const acceptedComparison = structured.comparison(commercial, acceptedJazzState);
          const differentJazzState = structured.setSlot(
            commercialStateA, firstJazzSlot, { label: "C7", source: "builder" }
          );
          const differentComparison = structured.comparison(commercial, differentJazzState);
          assert("comparisonUsesOnlyAuthoredAcceptedAnswers",
            acceptedComparison.slots[0].status === "matches" &&
            differentComparison.slots[0].status === "different" &&
            acceptedComparison.slots[1].status === "unanswered"
          );
          const valentine = questions.find((question) => question.id === "nzqa-2021-valentine-techniques");
          const nhtChoices = [
            "passing note", "accented passing note", "auxiliary / neighbour note",
            "suspension", "appoggiatura",
          ];
          const valentineFields = Object.fromEntries(
            valentine.interaction.fields.map((field) => [field.id, field])
          );
          assert("valentineUsesDedicatedNhtAndTechniqueChoiceSets",
            ["x", "y", "z"].every((id) =>
              valentineFields[id].choices.join("|") === nhtChoices.join("|")
            ) &&
            ["technique-1", "technique-2"].every((id) =>
              valentineFields[id].choices.includes("tonic pedal") &&
              valentineFields[id].choices.includes("descending chromatic inner line") &&
              !valentineFields[id].choices.includes("appoggiatura")
            )
          );
          let valentineState = structured.create(valentine);
          valentineState = structured.setField(valentineState, "technique-1", { label: "tonic pedal" });
          valentineState = structured.setField(valentineState, "technique-2", { label: "descending chromatic inner line" });
          const valentineComparison = structured.comparison(valentine, valentineState);
          let duplicateTechniqueState = structured.create(valentine);
          duplicateTechniqueState = structured.setField(duplicateTechniqueState, "technique-1", { label: "tonic pedal" });
          duplicateTechniqueState = structured.setField(duplicateTechniqueState, "technique-2", { label: "tonic pedal" });
          assert("valentineTechniqueComparisonIsOrderInsensitive",
            valentineComparison.fields.find((field) => field.id === "harmonic-techniques").status === "matches" &&
            !valentineComparison.fields.some((field) => ["technique-1", "technique-2"].includes(field.id)) &&
            structured.comparison(valentine, duplicateTechniqueState).fields
              .find((field) => field.id === "harmonic-techniques").status === "different"
          );
          const featureChoiceQuestions = [
            "nzqa-2023-poulenc-pedal", "feature-diminished", "feature-pedal",
            "feature-chromatic-bass", "feature-nonharmonic", "feature-harmonic-rhythm",
          ].map((id) => questions.find((question) => question.id === id));
          assert("featureFieldsDeclarePlausibleFieldSpecificChoices",
            featureChoiceQuestions.every((question) =>
              question.interaction.fields.every((field) =>
                Array.isArray(field.choices) && field.choices.length >= 4 &&
                field.acceptedAnswers.every((answer) => field.choices.includes(answer.label))
              )
            ) &&
            !questions.find((question) => question.id === "feature-nonharmonic")
              .interaction.fields[0].choices.includes("creates momentum") &&
            !questions.find((question) => question.id === "feature-pedal")
              .interaction.fields[1].choices.includes("F♯ diminished seventh")
          );
          const lockedStructured = structured.setSubmitted(acceptedJazzState);
          assert("structuredSubmissionSnapshotsAreLocked",
            lockedStructured.submitted && (() => {
              try {
                structured.setSlot(lockedStructured, firstJazzSlot, null);
                return false;
              } catch (error) {
                return error.message.includes("locked after submission");
              }
            })()
          );

          const completionQuestions = questions.filter((question) =>
            question.interaction.type === "notation-completion"
          );
          assert("completionScoresOnlyExposeAuthoredSuppliedHarmonicLabels",
            completionQuestions.every((question) =>
              question.score.harmonicEvents.every((event) => event.answerRole !== "editable") &&
              question.score.harmonicEvents.filter((event) => event.answerRole === "supplied").length ===
                question.score.harmonicEvents.filter((event) => event.questionLabel).length
            ) &&
            questions.find((question) => question.id === "piano-bflat-gminor")
              .score.harmonicEvents.every((event) => event.answerRole === "supplied")
          );
          assert("featureAndModulationLayoutAnchorsDoNotCreateAnswerBoxes",
            questions.filter((question) => ["features", "modulation"].includes(question.category))
              .every((question) => question.score.harmonicEvents.every((event) => event.answerRole === "none"))
          );

          const frame = document.querySelector("#app-frame");
          const appWindow = frame.contentWindow;
          const appDocument = frame.contentDocument;
          const preRevealLeaks = [];
          questions.forEach((question) => {
            appWindow.CadenceLab.showQuestion(question.id);
            const promptNodes = [
              appDocument.querySelector("#question-title"),
              appDocument.querySelector("#question-context"),
              appDocument.querySelector("#source-attribution"),
              appDocument.querySelector("#task-list"),
              appDocument.querySelector("#score"),
            ].filter(Boolean);
            const promptText = promptNodes.map((node) => node.innerText || node.textContent)
              .join(" ").toLocaleLowerCase("en-NZ");
            const exposedPromptAttributes = promptNodes.flatMap((node) => [node, ...node.querySelectorAll("*")])
              .flatMap((element) => [...element.attributes]
                .filter((attribute) =>
                  attribute.name === "aria-label" ||
                  attribute.name === "title" ||
                  attribute.name.startsWith("data-")
                )
                .map((attribute) => attribute.value)
              )
              .filter(Boolean)
              .join(" ")
              .toLocaleLowerCase("en-NZ");
            question.hiddenConceptTerms.forEach((term) => {
              const normalized = term.toLocaleLowerCase("en-NZ");
              if (
                promptText.includes(normalized) ||
                exposedPromptAttributes.includes(normalized)
              ) {
                preRevealLeaks.push(`${question.id}: ${term}`);
              }
            });
            if (
              appDocument.querySelector("#answer-heading").textContent ||
              appDocument.querySelector("#answer-copy").children.length ||
              appDocument.querySelector("#criteria-grid").children.length ||
              appDocument.querySelector("#model-score").children.length ||
              appDocument.querySelector("#model-score").hasAttribute("aria-label")
            ) {
              preRevealLeaks.push(`${question.id}: prebuilt answer DOM`);
            }
            const permissions = appWindow.CadenceLab.getPlaybackPermissions();
            if (permissions.question || permissions.context || permissions.model) {
              preRevealLeaks.push(`${question.id}: locked playback exposed`);
            }
            if (permissions.student !== (question.interaction.type === "notation-completion")) {
              preRevealLeaks.push(`${question.id}: Hear my work availability is incorrect`);
            }
          });
          assert("all32QuestionsAreSpoilerSafeBeforeReveal",
            preRevealLeaks.length === 0,
            preRevealLeaks
          );

          appWindow.CadenceLab.showQuestion("analysis-c-g");
          const editableScoreBoxes = [...appDocument.querySelectorAll(".analysis-box-editable")];
          assert("ordinaryRomanSlotsDoNotExposeSecondAnalysisControls",
            !appDocument.querySelector("#structured-builder summary") &&
            ![...appDocument.querySelectorAll('[data-part="inversion"] option')]
              .some((option) => option.value === "d")
          );
          const romanExtent = appDocument.querySelector('[data-part="extent"]');
          const romanInversion = appDocument.querySelector('[data-part="inversion"]');
          romanExtent.value = "seventh";
          romanExtent.dispatchEvent(new appWindow.Event("change", { bubbles: true }));
          const seventhIncludesD = [...romanInversion.options].some((option) => option.value === "d");
          romanInversion.value = "d";
          romanExtent.value = "triad";
          romanExtent.dispatchEvent(new appWindow.Event("change", { bubbles: true }));
          assert("romanInversionControlsFollowChordSize",
            seventhIncludesD && romanInversion.value === "root" &&
            ![...romanInversion.options].some((option) => option.value === "d")
          );
          appDocument.querySelectorAll(".structured-slot")[1].click();
          assert("pivotRomanSlotsExposeSecondAnalysisControls",
            appDocument.querySelector("#structured-builder summary")?.textContent.includes("second / pivot")
          );
          appDocument.querySelectorAll(".structured-slot")[0].click();
          editableScoreBoxes[1].dispatchEvent(new appWindow.PointerEvent("pointerdown", {
            bubbles: true,
          }));
          assert("clickingBlankScoreBoxOpensItsStructuredBuilder",
            editableScoreBoxes.length === 4 &&
            appDocument.querySelector(".structured-slot.is-active small").textContent === "Bar 2, beat 1" &&
            !appDocument.querySelector("#structured-builder").hidden
          );

          appWindow.CadenceLab.showQuestion("satb-f-c");
          assert("notationToolbarUsesLocalSvgIconsAndHighlightsSelectedStaff",
            appDocument.querySelectorAll("#duration-controls button").length === 7 &&
            [...appDocument.querySelectorAll("#duration-controls button")]
              .every((button) => button.querySelector("svg")) &&
            appDocument.querySelectorAll('.editor-hit-target.is-current-editable[data-staff="treble"]').length === 3 &&
            appDocument.querySelectorAll('.editor-hit-target.is-current-editable[data-staff="bass"]').length === 0
          );
          const beatThreeTarget = appDocument.querySelector(
            '.editor-hit-target[data-measure="1"][data-staff="treble"]'
          );
          const beatThreeBounds = beatThreeTarget.getBoundingClientRect();
          beatThreeTarget.dispatchEvent(new appWindow.PointerEvent("pointerdown", {
            bubbles: true,
            clientX: beatThreeBounds.left + beatThreeBounds.width / 2,
            clientY: beatThreeBounds.top + beatThreeBounds.height / 2,
          }));
          const pointerState = appWindow.CadenceLab.getStudentAnswer();
          assert("pointerTapAtBeatThreeDoesNotAppendEarlier",
            pointerState.measures[0].voices.alto.length === 1 &&
            pointerState.measures[0].voices.alto[0].beat === 3 &&
            appDocument.querySelector("#editor-status").textContent.includes("beat 3")
          );

          const revealedConcepts = [
            ["feature-pedal", "tonic pedal"],
            ["feature-diminished", "diminished seventh"],
            ["feature-chromatic-bass", "chromatic bass"],
            ["feature-harmonic-rhythm", "harmonic-rhythm"],
            ["feature-nonharmonic", "passing note"],
          ];
          const missingPostRevealConcepts = [];
          revealedConcepts.forEach(([questionId, term]) => {
            appWindow.CadenceLab.showQuestion(questionId);
            appWindow.CadenceLab.submit({ skipConfirmation: true, noScroll: true });
            if (!appDocument.body.innerText.toLocaleLowerCase("en-NZ").includes(term)) {
              missingPostRevealConcepts.push(`${questionId}: ${term}`);
            }
          });
          assert("auditedConceptLanguageAppearsAfterSubmission",
            missingPostRevealConcepts.length === 0,
            missingPostRevealConcepts
          );

          appWindow.CadenceLab.showQuestion("feature-diminished");
          const beforeRevealAnswerText = appDocument.querySelector("#answer-copy").textContent.toLocaleLowerCase("en-NZ");
          const submitted = appWindow.CadenceLab.submit({
            skipConfirmation: true,
            noScroll: true,
          });
          const afterRevealText = appDocument.body.innerText.toLocaleLowerCase("en-NZ");
          const afterPermissions = appWindow.CadenceLab.getPlaybackPermissions();
          assert("answerLanguageAppearsOnlyAfterSubmission",
            submitted && !beforeRevealAnswerText.includes("diminished seventh") &&
            afterRevealText.includes("diminished seventh")
          );
          assert("submissionBuildsModelDOMAndUnlocksComparisonPlayback",
            appDocument.querySelector("#answer-copy").children.length > 0 &&
            appDocument.querySelector("#model-score").children.length > 0 &&
            afterPermissions.question && afterPermissions.model && !afterPermissions.context
          );

          appWindow.CadenceLab.showQuestion("satb-f-c");
          const studentModeButton = appDocument.querySelector('[data-playback-mode="student"]');
          const questionModeButton = appDocument.querySelector('[data-playback-mode="question"]');
          assert("hearMyWorkIsAvailableButSilentTransportWaitsForAnEntry",
            !studentModeButton.disabled && questionModeButton.disabled &&
            appDocument.querySelector("#play-start").disabled
          );
          appWindow.CadenceLab.submit({ skipConfirmation: true, noScroll: true });
          const interactivePostPermissions = appWindow.CadenceLab.getPlaybackPermissions();
          assert("interactiveSubmissionUnlocksAllComparisonModes",
            ["student", "question", "context", "model"]
              .every((mode) => interactivePostPermissions[mode]) &&
            [...appDocument.querySelectorAll("[data-playback-mode]")]
              .every((button) => !button.disabled)
          );

          finish();
        } catch (error) {
          finish(error);
        }
      }, { once: true });
    </script>
  </body>
</html>
